name: All-Core Full Lifecycle Verification

# Scope: Full lifecycle for all 4 cores
# Web/AI/App/Lib: create → install → test → build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - ".github/workflows/all-core-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - ".github/workflows/all-core-lifecycle.yml"

permissions:
  contents: read

jobs:
  web-lifecycle:
    name: Web Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build mgc binary
        run: cargo build --release --bin mgc --no-default-features --features web --locked

      - name: Create web project
        shell: bash
        run: |
          ./target/release/mgc create-web react test-web-app --yes

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test-web-app
          test -f test-web-app/package.json

      - name: Install dependencies
        shell: bash
        run: |
          cd test-web-app
          ../target/release/mgc install

      - name: Verify node_modules
        shell: bash
        run: |
          test -d test-web-app/node_modules

      - name: Build project
        shell: bash
        run: |
          cd test-web-app
          ../target/release/mgc build

      - name: Verify build output
        shell: bash
        run: |
          test -d test-web-app/dist || test -d test-web-app/build

  ai-lifecycle:
    name: AI Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "0.12.10"

      - name: Build mgc binary
        run: cargo build --release --bin mgc --no-default-features --features ai --locked

      - name: Create AI project
        shell: bash
        run: |
          ./target/release/mgc create-ai python-agent test-ai-app

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test-ai-app
          test -f test-ai-app/pyproject.toml || test -f test-ai-app/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          cd test-ai-app
          python -m pip install build pytest
          uv lock
          ../target/release/mgc install

      - name: Test and build AI project
        shell: bash
        run: |
          cd test-ai-app
          python -m py_compile src/agent.py src/compression.py
          mkdir -p tests
          printf 'from agent import AIAgent\n\ndef test_agent():\n    assert AIAgent().run("CI")\n' > tests/test_agent.py
          PYTHONPATH=src ../target/release/mgc test
          ../target/release/mgc build
          test -d dist

  app-lifecycle:
    name: App Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build mgc binary
        run: cargo build --release --bin mgc --no-default-features --features app --locked

      - name: Create app project
        shell: bash
        run: |
          ./target/release/mgc create-app flutter test_app

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test_app
          test -f test_app/pubspec.yaml

      - name: Install dependencies
        shell: bash
        run: |
          cd test_app
          ../target/release/mgc install

      - name: Verify lockfile
        shell: bash
        run: |
          test -f test_app/pubspec.lock

      - name: Run tests
        shell: bash
        run: |
          cd test_app
          ../target/release/mgc test

      - name: Build app
        shell: bash
        run: |
          cd test_app
          ../target/release/mgc build

      - name: Verify build artifacts
        shell: bash
        run: |
          test -d test_app/build/flutter_assets

  lib-lifecycle:
    name: Lib Full (${{ matrix.lang }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lang: [rust, python, typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node.js
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build mgc binary
        run: cargo build --release --bin mgc --no-default-features --features lib --locked

      - name: Create lib project (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          ./target/release/mgc create-lib rust test-rust-lib

      - name: Create lib project (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          ./target/release/mgc create-lib python test-python-lib

      - name: Create lib project (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          ./target/release/mgc create-lib typescript test-ts-lib

      - name: Verify scaffold (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          test -d test-rust-lib
          test -f test-rust-lib/Cargo.toml

      - name: Verify scaffold (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          test -d test-python-lib
          test -f test-python-lib/pyproject.toml || test -f test-python-lib/setup.py

      - name: Verify scaffold (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          test -d test-ts-lib
          test -f test-ts-lib/package.json

      - name: Build and test (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          cd test-rust-lib
          ../target/release/mgc install
          ../target/release/mgc build
          ../target/release/mgc test

      - name: Verify Rust artifacts
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          test -f test-rust-lib/target/release/libtest_rust_lib.rlib || \
          test -f test-rust-lib/target/release/test_rust_lib.dll || \
          test -f test-rust-lib/target/release/libtest_rust_lib.dylib || \
          test -f test-rust-lib/target/release/libtest_rust_lib.so

      - name: Install and test (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          cd test-python-lib
          python -m pip install build pytest
          ../target/release/mgc install
          ../target/release/mgc build
          python -m py_compile src/test_python_lib/__init__.py

      - name: Install and build (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          cd test-ts-lib
          ../target/release/mgc install
          ../target/release/mgc build
          test -d dist || test -d lib || test -d build

  lifecycle-summary:
    name: Full Lifecycle Summary
    needs: [web-lifecycle, ai-lifecycle, app-lifecycle, lib-lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        run: |
          echo "=== ALL-CORE FULL LIFECYCLE RESULTS ==="
          echo ""
          echo "Web:  ${{ needs.web-lifecycle.result }}"
          echo "AI:   ${{ needs.ai-lifecycle.result }}"
          echo "App:  ${{ needs.app-lifecycle.result }}"
          echo "Lib:  ${{ needs.lib-lifecycle.result }}"
          echo ""

          # Check each core
          FAIL=0

          if [[ "${{ needs.web-lifecycle.result }}" != "success" ]]; then
            echo "❌ Web lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.ai-lifecycle.result }}" != "success" ]]; then
            echo "❌ AI lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.app-lifecycle.result }}" != "success" ]]; then
            echo "❌ App lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.lib-lifecycle.result }}" != "success" ]]; then
            echo "❌ Lib lifecycle FAILED"
            FAIL=1
          fi

          if [[ $FAIL -eq 1 ]]; then
            echo ""
            echo "❌ LIFECYCLE VERIFICATION FAILED"
            exit 1
          fi

          echo "✅ ALL CORES: Full lifecycle verified"
          echo ""
          echo "Verified:"
          echo "- Create (CLI commands work)"
          echo "- Install (dependencies resolve)"
          echo "- Test (where applicable)"
          echo "- Build (artifacts generated)"
