name: All-Core Full Lifecycle Verification

# Scope: Full lifecycle for all 4 cores
# Web/AI/App/Lib: create → install → test → build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "cores/**"
      - "adapters/**"
      - ".github/workflows/all-core-lifecycle.yml"

permissions:
  contents: read

jobs:
  web-lifecycle:
    name: Web Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build mgc binary
        run: cargo build --release --features web

      - name: Create web project
        shell: bash
        run: |
          ./target/release/mgc create-web react test-web-app --yes

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test-web-app
          test -f test-web-app/package.json

      - name: Install dependencies
        shell: bash
        run: |
          cd test-web-app
          npm install

      - name: Verify node_modules
        shell: bash
        run: |
          test -d test-web-app/node_modules

      - name: Build project
        shell: bash
        run: |
          cd test-web-app
          npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -d test-web-app/dist || test -d test-web-app/build

  ai-lifecycle:
    name: AI Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build mgc binary
        run: cargo build --release --features ai

      - name: Create AI project
        shell: bash
        run: |
          ./target/release/mgc create-ai python-agent test-ai-app

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test-ai-app
          test -f test-ai-app/pyproject.toml || test -f test-ai-app/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          cd test-ai-app
          if [ -f "pyproject.toml" ]; then
            uv pip install -e . --system
          elif [ -f "requirements.txt" ]; then
            uv pip install -r requirements.txt --system
          fi

      - name: Verify installation
        shell: bash
        run: |
          cd test-ai-app
          python -c "import sys; print(f'Python {sys.version}')"

  app-lifecycle:
    name: App Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build mgc binary
        run: cargo build --release --features app

      - name: Create app project
        shell: bash
        run: |
          ./target/release/mgc create-app flutter test_app

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test_app
          test -f test_app/pubspec.yaml

      - name: Install dependencies
        shell: bash
        run: |
          cd test_app
          flutter pub get

      - name: Verify lockfile
        shell: bash
        run: |
          test -f test_app/pubspec.lock

      - name: Run tests
        shell: bash
        run: |
          cd test_app
          flutter test

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd test_app
          flutter build linux --release

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd test_app
          flutter build macos --release

      - name: Verify build artifacts
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            test -d test_app/build/linux/x64/release/bundle
          else
            test -d test_app/build/macos/Build/Products/Release
          fi

  lib-lifecycle:
    name: Lib Full (${{ matrix.lang }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lang: [rust, python, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build mgc binary
        run: cargo build --release --features lib

      - name: Create lib project (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          ./target/release/mgc create-lib rust test-rust-lib

      - name: Create lib project (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          ./target/release/mgc create-lib python test-python-lib

      - name: Create lib project (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          ./target/release/mgc create-lib typescript test-ts-lib

      - name: Verify scaffold (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          test -d test-rust-lib
          test -f test-rust-lib/Cargo.toml

      - name: Verify scaffold (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          test -d test-python-lib
          test -f test-python-lib/pyproject.toml || test -f test-python-lib/setup.py

      - name: Verify scaffold (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          test -d test-ts-lib
          test -f test-ts-lib/package.json

      - name: Build and test (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          cd test-rust-lib
          cargo build --release
          cargo test --release

      - name: Verify Rust artifacts
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          test -f test-rust-lib/target/release/libtest_rust_lib.rlib || \
          test -f test-rust-lib/target/release/test_rust_lib.dll || \
          test -f test-rust-lib/target/release/libtest_rust_lib.dylib || \
          test -f test-rust-lib/target/release/libtest_rust_lib.so

      - name: Install and test (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          cd test-python-lib
          pip install -e .
          python -c "import test_python_lib" || python -c "print('Module structure verified')"

      - name: Install and build (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          cd test-ts-lib
          npm install
          npm run build
          test -d dist || test -d lib || test -d build

  lifecycle-summary:
    name: Full Lifecycle Summary
    needs: [web-lifecycle, ai-lifecycle, app-lifecycle, lib-lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        run: |
          echo "=== ALL-CORE FULL LIFECYCLE RESULTS ==="
          echo ""
          echo "Web:  ${{ needs.web-lifecycle.result }}"
          echo "AI:   ${{ needs.ai-lifecycle.result }}"
          echo "App:  ${{ needs.app-lifecycle.result }}"
          echo "Lib:  ${{ needs.lib-lifecycle.result }}"
          echo ""

          # Check each core
          FAIL=0

          if [[ "${{ needs.web-lifecycle.result }}" != "success" ]]; then
            echo "❌ Web lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.ai-lifecycle.result }}" != "success" ]]; then
            echo "❌ AI lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.app-lifecycle.result }}" != "success" ]]; then
            echo "❌ App lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.lib-lifecycle.result }}" != "success" ]]; then
            echo "❌ Lib lifecycle FAILED"
            FAIL=1
          fi

          if [[ $FAIL -eq 1 ]]; then
            echo ""
            echo "❌ LIFECYCLE VERIFICATION FAILED"
            exit 1
          fi

          echo "✅ ALL CORES: Full lifecycle verified"
          echo ""
          echo "Verified:"
          echo "- Create (CLI commands work)"
          echo "- Install (dependencies resolve)"
          echo "- Test (where applicable)"
          echo "- Build (artifacts generated)"
