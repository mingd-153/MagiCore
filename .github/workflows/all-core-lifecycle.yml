name: All-Core Scaffold Verification

# Scope: Verify CLI commands exist and basic scaffolding works
# NOT full lifecycle (install/test/build/run deferred - need CLI maturity)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'cores/**'
      - '.github/workflows/all-core-lifecycle.yml'

permissions:
  contents: read

jobs:
  web-scaffold:
    name: Web Scaffold (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build mgc
        run: cargo build --release --features web

      - name: Create web project
        shell: bash
        run: |
          ./target/release/mgc create-web react test-web-app --yes

      - name: Verify scaffold files
        shell: bash
        run: |
          test -d test-web-app
          test -f test-web-app/package.json
          echo "✅ Web scaffold verified"

  ai-scaffold:
    name: AI Scaffold (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build mgc
        run: cargo build --release --features ai

      - name: Create AI project
        shell: bash
        run: |
          ./target/release/mgc create-ai python-agent test-ai-app

      - name: Verify scaffold files
        shell: bash
        run: |
          test -d test-ai-app
          test -f test-ai-app/pyproject.toml || test -f test-ai-app/requirements.txt
          echo "✅ AI scaffold verified"

  app-scaffold:
    name: App Scaffold (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build mgc
        run: cargo build --release --features app

      - name: Create app project
        shell: bash
        run: |
          ./target/release/mgc create-app flutter test_app

      - name: Verify scaffold files
        shell: bash
        run: |
          test -d test_app
          test -f test_app/pubspec.yaml
          echo "✅ App scaffold verified"

  lib-scaffold:
    name: Lib Scaffold (${{ matrix.lang }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lang: [rust, python, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Build mgc
        run: cargo build --release --features lib

      - name: Create lib project (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          ./target/release/mgc create-lib rust test-rust-lib

      - name: Create lib project (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          ./target/release/mgc create-lib python test-python-lib

      - name: Create lib project (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          ./target/release/mgc create-lib typescript test-ts-lib

      - name: Verify scaffold files (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          test -d test-rust-lib
          test -f test-rust-lib/Cargo.toml
          echo "✅ Rust lib scaffold verified"

      - name: Verify scaffold files (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          test -d test-python-lib
          test -f test-python-lib/pyproject.toml || test -f test-python-lib/setup.py
          echo "✅ Python lib scaffold verified"

      - name: Verify scaffold files (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          test -d test-ts-lib
          test -f test-ts-lib/package.json
          echo "✅ TypeScript lib scaffold verified"

  scaffold-summary:
    name: Scaffold Summary
    needs: [web-scaffold, ai-scaffold, app-scaffold, lib-scaffold]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "=== ALL-CORE SCAFFOLD VERIFICATION ==="
          echo ""
          echo "Web:  ${{ needs.web-scaffold.result }}"
          echo "AI:   ${{ needs.ai-scaffold.result }}"
          echo "App:  ${{ needs.app-scaffold.result }}"
          echo "Lib:  ${{ needs.lib-scaffold.result }}"
          echo ""

          # Fail if any required job failed
          if [[ "${{ needs.web-scaffold.result }}" != "success" ]]; then
            echo "❌ Web scaffold FAILED"
            exit 1
          fi
          if [[ "${{ needs.ai-scaffold.result }}" != "success" ]]; then
            echo "❌ AI scaffold FAILED"
            exit 1
          fi
          if [[ "${{ needs.app-scaffold.result }}" != "success" ]]; then
            echo "❌ App scaffold FAILED"
            exit 1
          fi
          if [[ "${{ needs.lib-scaffold.result }}" != "success" ]]; then
            echo "❌ Lib scaffold FAILED"
            exit 1
          fi

          echo "✅ All cores: scaffold parity verified"
          echo ""
          echo "Scope: CLI commands + basic templates"
          echo "NOT verified: install/test/build/run/optimizer/cache"
          echo "Full lifecycle: Requires CLI maturity (deferred)"
