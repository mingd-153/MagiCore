name: All-Core Full Lifecycle Verification

# Scope: Full lifecycle for all 4 cores
# Web/AI/App/Lib: create → install → test → build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - ".github/workflows/all-core-lifecycle.yml"
  push:
    branches: [main, "fix/**"]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - ".github/workflows/all-core-lifecycle.yml"

permissions:
  contents: read

jobs:
  web-lifecycle:
    name: Web Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Setup Go for esbuild-rs
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 is LTS (Active until 2027-04). Node 26 is Current line.
          # Runner has node 24.x; pinning explicitly.
          node-version: "24"

      - name: Build mgc binary
        run: cargo build --release --bin mgc --no-default-features --features web --locked

      - name: Create web project
        shell: bash
        run: |
          ./target/release/mgc create-web react test-web-app --yes

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test-web-app
          test -f test-web-app/package.json

      - name: Install dependencies
        shell: bash
        run: |
          cd test-web-app
          ../target/release/mgc install

      - name: Verify node_modules
        shell: bash
        run: |
          test -d test-web-app/node_modules

      - name: Build project
        shell: bash
        run: |
          cd test-web-app
          # Diagnostic (temporary): the mgc spawn of node reports an
          # ncrypto::CSPRNG crash whose native frame names process "npm" —
          # we need the runner-side view of what 'node' resolves to before
          # any further fix. Runs only on windows.
          # Chẩn đoán (tạm): crash ghi process "npm" — cần thấy runner
          # resolve 'node' như nào trước khi fix tiếp. Chỉ chạy trên windows.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "--- where node ---"; where.exe node
            echo "--- where node.cmd ---"; where.exe node.cmd
            echo "--- node -p version ---"; node -p "process.version + ' / ' + process.execPath"
          fi
          ../target/release/mgc build

      - name: Verify build output
        shell: bash
        run: |
          test -d test-web-app/dist || test -d test-web-app/build

  ai-lifecycle:
    name: AI Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Setup Go for esbuild-rs
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1 (latest, node24)
        with:
          version: "0.12.10"

      - name: Build mgc binary
        run: cargo build --release --bin mgc --no-default-features --features ai --locked

      - name: Create AI project
        shell: bash
        run: |
          ./target/release/mgc create-ai python-agent test-ai-app

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test-ai-app
          test -f test-ai-app/pyproject.toml || test -f test-ai-app/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          cd test-ai-app
          # mgc install (AI) is fail-closed: it requires uv.lock or
          # requirements.lock to exist. Generate the lock with uv (retried
          # against pypi.org runner-side DNS flakes), then install.
          # mgc install AI fail-closed: cần uv.lock/requirements.lock — tạo
          # lock bằng uv (retry chống mất DNS pypi trên runner) rồi install.
          for i in 1 2 3 4 5; do
            if python -m pip install build pytest; then break; fi
            echo "pip install failed (attempt $i) — retrying in 20s"
            sleep 20
          done
          for i in 1 2 3 4 5; do
            if uv lock; then break; fi
            echo "uv lock failed (attempt $i) — retrying in 30s"
            sleep 30
          done
          test -f uv.lock || test -f requirements.lock
          ../target/release/mgc install

      - name: Test and build AI project
        shell: bash
        run: |
          cd test-ai-app
          python -m py_compile src/agent.py src/compression.py
          mkdir -p tests
          printf 'from agent import AIAgent\n\ndef test_agent():\n    assert AIAgent().run("CI")\n' > tests/test_agent.py
          PYTHONPATH=src ../target/release/mgc test
          ../target/release/mgc build
          test -d dist

  app-lifecycle:
    name: App Full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Setup Go for esbuild-rs
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0 (latest, node24)
        with:
          flutter-version: "3.47.2"
          channel: "stable"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build mgc binary
        run: cargo build --release --bin mgc --no-default-features --features app --locked

      - name: Create app project
        shell: bash
        run: |
          ./target/release/mgc create-app flutter test_app

      - name: Verify scaffold
        shell: bash
        run: |
          test -d test_app
          test -f test_app/pubspec.yaml

      - name: Install dependencies
        shell: bash
        run: |
          cd test_app
          ../target/release/mgc install

      - name: Verify lockfile
        shell: bash
        run: |
          test -f test_app/pubspec.lock

      - name: Run tests
        shell: bash
        run: |
          cd test_app
          ../target/release/mgc test

      - name: Build app
        shell: bash
        run: |
          cd test_app
          ../target/release/mgc build

      - name: Verify build artifacts
        shell: bash
        run: |
          test -d test_app/build/flutter_assets

  lib-lifecycle:
    name: Lib Full (${{ matrix.lang }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lang: [rust, python, typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Setup Go for esbuild-rs
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Setup Node.js
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 is LTS (Active until 2027-04). Node 26 is Current line.
          # Runner has node 24.x; pinning explicitly.
          node-version: "24"

      - name: Build mgc binary
        run: cargo build --release --bin mgc --no-default-features --features lib --locked

      - name: Create lib project (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          ./target/release/mgc create-lib rust test-rust-lib

      - name: Create lib project (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          ./target/release/mgc create-lib python test-python-lib

      - name: Create lib project (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          ./target/release/mgc create-lib typescript test-ts-lib

      - name: Verify scaffold (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          test -d test-rust-lib
          test -f test-rust-lib/Cargo.toml

      - name: Verify scaffold (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          test -d test-python-lib
          test -f test-python-lib/pyproject.toml || test -f test-python-lib/setup.py

      - name: Verify scaffold (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          test -d test-ts-lib
          test -f test-ts-lib/package.json

      - name: Build and test (Rust)
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          cd test-rust-lib
          ../target/release/mgc install
          ../target/release/mgc build
          ../target/release/mgc test

      - name: Verify Rust artifacts
        if: matrix.lang == 'rust'
        shell: bash
        run: |
          # mgc build runs `cargo build` (debug profile) — artifacts land in
          # target/debug, not target/release. Assert the debug artifact.
          # mgc build chạy `cargo build` (debug) — artifact nằm ở target/debug.
          test -f test-rust-lib/target/debug/libtest_rust_lib.rlib || \
          test -f test-rust-lib/target/debug/test_rust_lib.dll || \
          test -f test-rust-lib/target/debug/libtest_rust_lib.dylib || \
          test -f test-rust-lib/target/debug/libtest_rust_lib.so || \
          test -f test-rust-lib/target/debug/libtest_rust_lib.rmeta

      - name: Install and test (Python)
        if: matrix.lang == 'python'
        shell: bash
        run: |
          cd test-python-lib
          # pypi.org retry — chống rate-limit flake (không phải lỗi code).
          for i in 1 2 3; do
            if python -m pip install build pytest; then break; fi
            echo "pip install failed (attempt $i) — retrying in 20s"
            sleep 20
          done
          ../target/release/mgc install
          ../target/release/mgc build
          python -m py_compile src/test_python_lib/__init__.py

      - name: Install and build (TypeScript)
        if: matrix.lang == 'typescript'
        shell: bash
        run: |
          cd test-ts-lib
          ../target/release/mgc install
          ../target/release/mgc build
          test -d dist || test -d lib || test -d build

  lifecycle-summary:
    name: Full Lifecycle Summary
    needs: [web-lifecycle, ai-lifecycle, app-lifecycle, lib-lifecycle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        run: |
          echo "=== ALL-CORE FULL LIFECYCLE RESULTS ==="
          echo ""
          echo "Web:  ${{ needs.web-lifecycle.result }}"
          echo "AI:   ${{ needs.ai-lifecycle.result }}"
          echo "App:  ${{ needs.app-lifecycle.result }}"
          echo "Lib:  ${{ needs.lib-lifecycle.result }}"
          echo ""

          # Check each core
          FAIL=0

          if [[ "${{ needs.web-lifecycle.result }}" != "success" ]]; then
            echo "❌ Web lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.ai-lifecycle.result }}" != "success" ]]; then
            echo "❌ AI lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.app-lifecycle.result }}" != "success" ]]; then
            echo "❌ App lifecycle FAILED"
            FAIL=1
          fi

          if [[ "${{ needs.lib-lifecycle.result }}" != "success" ]]; then
            echo "❌ Lib lifecycle FAILED"
            FAIL=1
          fi

          if [[ $FAIL -eq 1 ]]; then
            echo ""
            echo "❌ LIFECYCLE VERIFICATION FAILED"
            exit 1
          fi

          echo "✅ ALL CORES: Full lifecycle verified"
          echo ""
          echo "Verified:"
          echo "- Create (CLI commands work)"
          echo "- Install (dependencies resolve)"
          echo "- Test (where applicable)"
          echo "- Build (artifacts generated)"
