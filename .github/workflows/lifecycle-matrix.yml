name: Lifecycle Capability Matrix

# P0-2 (Tech Lead 2026-09-11): the AUDIT capability matrix can never
# justify product "supported" claims — lifecycle is a SEPARATE
# dimensions including package operations (install/add/remove/update/list,
# frozen/offline, integrity, store/GC) and project lifecycle probes.
# with its own binary-driven evidence. This lane generates the
# lifecycle matrix on every PR touching product code and refuses to
# let lifecycle support regress silently. Java/.NET/Go scaffolds that
# fall back to another language are FAILED creates here (honest).
#
# The earlier six-lane RC gate is historical only. V1.2 evaluates the
# complete lane registry: release-blocking lanes require lifecycle evidence,
# and native-PM evidence is required only for MGC-native package claims.
# Named scope-outs remain visible with exact source-controlled reasons.
# (Gate sáu lane RC trước đây chỉ còn là lịch sử. V1.2 đánh giá toàn registry:
# lane chặn release cần lifecycle evidence; native-PM evidence chỉ bắt buộc
# với claim package MGC-native. Scope-out vẫn hiện cùng lý do từ source.)
#
# P0-2: matrix audit KHÔNG BAO GIỜ suy ra năng lực product — lifecycle
# là dimension RIÊNG với evidence binary riêng. Lane sinh matrix này
# mỗi PR chạm code product; scaffold java/.net/go rơi fallback ngôn ngữ
# khác sẽ là create FAILED (trung thực, không độn sự thật).
# Every release-blocking lane is evaluated against its own required dimensions;
# explicit scope-outs remain in the global inventory and cannot hide native claims.
# (Mỗi lane chặn release được đánh giá theo dimensions riêng; scope-out tường
# minh vẫn ở trong inventory toàn cục và không thể che giấu claim native.)
#
# Gate 11-C schema v7 (2026-09-29): framework-qualified lane identity plus
# per-required-dimension lifecycle owner evidence (wrapper success is not native),
# 23 dimensions × six-value status,
# plus clean-source-tree provenance required for platform promotion.
# vocabulary (native/managed/plain-delegation-pass, unverified,
# unsupported, failed). Gate 11-D evidence-only Windows: windows-latest
# runs the SAME matrix and uploads the artifact + prints verdicts, but
# the Enforce step stays ubuntu/macos-only — the Windows lane is not
# yet release-gate mature (dev/run probes, signal-based recovery and
# toolchain behaviors differ), so blocking on it would gate on
# unmatured evidence while BLOCKING lanes must stay the two hardened
# OSes. Windows evidence is recorded HONESTLY (failed stays failed in
# the artifact) — this is evidence collection, never a fake pass.
# (Gate 11-C schema v7: lane identity theo framework, owner từng lifecycle dimension,
# 23 dimension × bộ 6 trạng thái, kèm provenance
# source tree sạch bắt buộc trước khi promotion platform. Windows chỉ
# thu evidence: windows-latest chạy CÙNG matrix, upload artifact + in
# verdict, nhưng bước Enforce vẫn chỉ ubuntu/macos — lane Windows chưa
# đủ chín để làm release gate (probe dev/run, recovery dựa signal và
# hành vi toolchain khác nhau), chặn trên nó là chặn bằng evidence chưa
# chín trong khi lane bắt buộc phải giữ ở 2 OS đã gia cố. Evidence
# Windows ghi TRUNG THỰC (failed vẫn là failed trong artifact) — đây là
# thu thập bằng chứng, không bao giờ là pass giả.)

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - ".github/workflows/lifecycle-matrix.yml"
  push:
    branches: [main, "fix/**"]
    paths:
      - "cli/**"
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - ".github/workflows/lifecycle-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lifecycle-matrix:
    name: lifecycle matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Windows runners resolve `python` (setup-python shims `python3`
          # unreliably across shells); POSIX runners keep `python3`.
          # (Runner Windows gọi `python` (shim `python3` không ổn định
          # giữa các shell); runner POSIX giữ `python3`.)
          - os: windows-latest
            python_cmd: python
          - os: ubuntu-latest
            python_cmd: python3
          - os: macos-latest
            python_cmd: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Python runtime (AI/Lib Python build and test)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test native-PM verdict and matrix provenance guards
        run: ${{ matrix.python_cmd }} scripts/test_native_pm_verdict.py

      - name: Test binary-to-matrix ownership cross-check
        run: ${{ matrix.python_cmd }} scripts/test_dep_gate_consistency.py

      - name: Setup Node.js (web lane)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Pulumi CLI (cloud lifecycle lane)
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: "3.267.0"

      - name: Setup Go (lib/go lane toolchain)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      # App lane: flutter toolchain for create→install→test→build.
      # Lane App: toolchain flutter cho create→install→test→build.
      - name: Setup Flutter (app lane)
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0 (latest, node24)
        with:
          flutter-version: "3.47.4"
          channel: "stable"

      - name: Install Linux build deps (flutter lane)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build mgc binary
        run: cargo build --bin mgc --locked

      - name: Generate lifecycle matrix (real binary, real steps)
        # The script resolves the Windows binary (mgc.exe) itself, so the
        # POSIX-spelled MGC_LIFECYCLE_BIN works on every OS.
        # (Script tự quy về binary Windows (mgc.exe), nên MGC_LIFECYCLE_BIN
        # viết kiểu POSIX chạy trên mọi OS.)
        run: ${{ matrix.python_cmd }} scripts/lifecycle_capability_matrix.py
        env:
          MGC_LIFECYCLE_BIN: ./target/debug/mgc
          MGC_LIFECYCLE_MATRIX_OUT: docs/specs/lifecycleCapabilityMatrix.json

      - name: Print per-lane verdicts into the log (evidence, incl. Windows)
        # Gate 11-D evidence-only: the verdict of EVERY lane is printed so
        # the CI log carries the evidence even when the artifact is not
        # downloaded — on Windows this is the primary honest record.
        # (Chỉ thu evidence: verdict MỌI lane được in ra để log CI mang
        # bằng chứng kể cả khi artifact không được tải — trên Windows đây
        # là bản ghi trung thực chính.)
        shell: python {0}
        run: |
          import json
          data = json.load(open("docs/specs/lifecycleCapabilityMatrix.json"))
          print(f"lifecycle matrix schema_version={data.get('schema_version')} "
                f"dimensions={len(data.get('dimensions', []))}")
          for lane in data["lanes"]:
              print(f"{lane['core']}/{lane['language']}: "
                    f"verdict={lane['verdict']} native_pm={lane.get('native_pm_verdict')}")
              for dim, status in lane["dimensions"].items():
                  print(f"  {dim:<14} {status}")

      - name: Upload lifecycle matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lifecycle-capability-matrix-${{ runner.os }}
          path: docs/specs/lifecycleCapabilityMatrix.json

      - name: Enforce global v1.2 lifecycle and native-PM gate
        # Gate 11-D evidence-only Windows: the ENFORCE step runs ONLY on
        # ubuntu/macos — the two hardened OSes. The Windows lane collects
        # evidence (matrix + artifact + log) but does not gate: dev/run
        # probes, POSIX-signal recovery and toolchain behaviors are not
        # Windows-mature yet. Evidence stays honest; the gate does not
        # loosen anywhere else.
        # (Enforce CHỈ chạy trên ubuntu/macos — 2 OS đã gia cố. Lane
        # Windows thu evidence (matrix + artifact + log) nhưng không gate:
        # probe dev/run, recovery dựa POSIX-signal và hành vi toolchain
        # chưa chín trên Windows. Evidence vẫn trung thực; gate không nới
        # lỏng ở bất kỳ đâu khác.)
        if: matrix.os != 'windows-latest'
        # Every declared lane stays in the matrix. Release-blocking lanes must
        # pass lifecycle evidence; native-PM evidence is required only for
        # MGC-native claims, including claims on scoped-out lanes. Scoped-out
        # lanes/frameworks remain visible with source-controlled reasons.
        # Missing or unknown required evidence still fails.
        # (Mọi lane đã khai vẫn nằm trong matrix. Lane chặn release phải qua
        # lifecycle. Claim MGC-native phải có native-PM evidence, kể cả khi
        # lane scope-out. Scope-out vẫn hiện cùng
        # lý do từ source; thiếu evidence bắt buộc hoặc không rõ vẫn fail.)
        shell: python3 {0}
        run: |
          import json, sys
          sys.path.insert(0, "scripts")
          from lifecycle_capability_matrix import (
              ALL_STATUSES,
              ALL_DIMENSIONS,
              SCHEMA_VERSION,
              LIFECYCLE_OWNER_VALUES,
              PASS_STATUSES,
              PLATFORM_EVIDENCE_RELEASE_SCOPE,
              native_pm_claim_errors,
              native_pm_claim_scope,
              required_dimensions_for_lane,
              lifecycle_status_for_owner,
              lifecycle_status_owner_matches,
              framework_catalog_errors,
              native_pm_lane_errors,
              lifecycle_lane_owner_contract_errors,
              release_scope_out_reason,
          )

          data = json.load(open("docs/specs/lifecycleCapabilityMatrix.json"))
          failures = []
          if data.get("schema_version") != SCHEMA_VERSION:
              failures.append(
                  f"matrix schema {data.get('schema_version')!r} does not match {SCHEMA_VERSION}"
              )
          # V1.2 global scope is derived from the same declared lane registry.
          # Phạm vi toàn cục V1.2 lấy từ cùng registry lane.
          RELEASE_SCOPE = set(PLATFORM_EVIDENCE_RELEASE_SCOPE)
          seen = set()
          release_blocking_seen = set()
          # Every lane that declares mgc-native ownership is release-gated
          # against its runtime native-PM evidence. Deriving this set from
          # the matrix prevents a hand-maintained allowlist from leaving
          # claimed languages/cores outside the gate.
          # Mọi lane tự khai MGC-native phải qua gate evidence runtime;
          # lấy tập trực tiếp từ matrix để không bỏ sót core/ngôn ngữ.
          NATIVE_PM_SCOPE = native_pm_claim_scope(data["lanes"])
          failures.extend(
              framework_catalog_errors(data.get("framework_catalog"), data["lanes"])
          )
          for lane in data["lanes"]:
              key = (lane["core"], lane["language"], lane.get("framework_id", ""))
              label = f"{key[0]}/{key[1]}" + (f"#{key[2]}" if key[2] else "")
              if key not in RELEASE_SCOPE:
                  failures.append(f"unexpected lane outside global v1.2 scope: {key}")
                  continue
              if key in seen:
                  failures.append(f"duplicate lane in lifecycle matrix: {key}")
                  continue
              seen.add(key)
              failures.extend(lifecycle_lane_owner_contract_errors(lane))
              expected_scope_out_reason = release_scope_out_reason(*key)
              scope_out = expected_scope_out_reason is not None
              if not scope_out:
                  release_blocking_seen.add(key)
              if lane.get("release_scope_out_reason") != expected_scope_out_reason:
                  failures.append(
                      f"{label} release scope-out reason differs from the source contract"
                  )
              expected_gate_role = "scoped-out" if scope_out else "release-blocking"
              if lane.get("gate_role") != expected_gate_role:
                  failures.append(
                      f"{label} gate_role = {lane.get('gate_role')!r} "
                      f"(expected {expected_gate_role!r})"
                  )
              if lane.get("evidence_only") is not scope_out:
                  failures.append(
                      f"{label} evidence_only differs from the source scope contract"
                  )
              if not scope_out and lane.get("toolchain_available") is not True:
                  failures.append(
                      f"{label} required toolchain is unavailable or unverified"
                  )
              source_required = required_dimensions_for_lane(*key)
              required = lane.get("required_dimensions")
              if source_required is None or required != list(source_required):
                  failures.append(
                      f"{label} required_dimensions differ from the source contract"
                  )
              lifecycle_owners = lane.get("lifecycle_owners")
              dimensions = lane.get("dimensions", {})
              if not isinstance(dimensions, dict):
                  failures.append(f"{label} dimensions must be an object")
                  dimensions = {}
              if not isinstance(lifecycle_owners, dict):
                  failures.append(f"{label} is missing lifecycle owner evidence")
              else:
                  unknown_owner_dimensions = sorted(
                      set(lifecycle_owners) - set(ALL_DIMENSIONS)
                  )
                  if unknown_owner_dimensions:
                      failures.append(
                          f"{label} has unknown lifecycle owner dimensions: "
                          + ", ".join(unknown_owner_dimensions)
                      )
                  for dimension in source_required or ():
                      owner = lifecycle_owners.get(dimension)
                      if not isinstance(owner, str) or owner not in LIFECYCLE_OWNER_VALUES:
                          failures.append(
                              f"{label} {dimension} has missing/invalid lifecycle owner: {owner!r}"
                          )
                      elif (
                          (not scope_out or lane.get("toolchain_available") is True)
                          and not lifecycle_status_owner_matches(
                              dimensions.get(dimension), owner
                          )
                      ):
                          failures.append(
                              f"{label} {dimension} status/owner mismatch: "
                              f"{dimensions.get(dimension)!r} vs {owner!r}"
                          )
              unknown_dimensions = sorted(set(dimensions) - set(ALL_DIMENSIONS))
              if unknown_dimensions:
                  failures.append(
                      f"{label} has unknown dimensions: "
                      + ", ".join(unknown_dimensions)
                  )
              missing_dimensions = sorted(set(ALL_DIMENSIONS) - set(dimensions))
              if missing_dimensions:
                  failures.append(
                      f"{label} is missing v1.2 dimensions: "
                      + ", ".join(missing_dimensions)
                  )
              invalid_dimensions = sorted(
                  name for name, status in dimensions.items()
                  if status not in ALL_STATUSES
              )
              if invalid_dimensions:
                  failures.append(
                      f"{label} has invalid dimension statuses: "
                      + ", ".join(
                          f"{name}={dimensions.get(name)!r}"
                          for name in invalid_dimensions
                      )
                  )
              required_failures = [
                  name for name in (source_required or ())
                  if dimensions.get(name) not in PASS_STATUSES
              ]
              if required_failures and not scope_out:
                  failures.append(
                      f"{label} has non-passing required dimensions: "
                      + ", ".join(
                          f"{name}={dimensions.get(name, 'missing')}"
                          for name in required_failures
                      )
                  )
              if not scope_out and lane["verdict"] != "orchestration-lifecycle-passed":
                  failures.append(
                      f"{label} lifecycle verdict = {lane['verdict']} "
                      f"(expected orchestration-lifecycle-passed) — dimensions: {lane['dimensions']}"
                  )
              if lane.get("dependency_owner") != "mgc-native":
                  failures.extend(native_pm_lane_errors(lane))
              # Taxonomy contract (P0-D): every lane MUST declare its
              # install owner, including explicit unsupported lanes. A
              # missing or contradictory owner is a matrix bug, not a pass.
              # (Hợp đồng taxonomy: mọi lane PHẢI khai chủ sở hữu
              # install, kể cả lane unsupported tường minh. Thiếu owner
              # hoặc owner mâu thuẫn là lỗi matrix, không phải pass.)
              owner = lane.get("install_owner")
              if owner not in (
                  "native-engine", "managed-delegation", "plain-delegation", "unsupported"
              ):
                  failures.append(
                      f"{label} missing install_owner — the matrix "
                      f"must name who owns the install (taxonomy P0-D)"
                  )
              elif key in NATIVE_PM_SCOPE and owner != "native-engine":
                  failures.append(
                      f"{label} install_owner = {owner} — a "
                      f"native-PM claim lane must be native-engine"
                  )
          missing = RELEASE_SCOPE - seen
          if missing:
              failures.append(
                  "release-scope lanes missing from matrix: "
                  + ", ".join(
                      f"{c}/{l}" + (f"#{f}" if f else "")
                      for c, l, f in sorted(missing)
                  )
              )
          failures.extend(native_pm_claim_errors(data["lanes"]))
          if seen != RELEASE_SCOPE:
              failures.append(
                  "global v1.2 lane set mismatch: "
                  f"missing={sorted(RELEASE_SCOPE - seen)}, "
                  f"unexpected={sorted(seen - RELEASE_SCOPE)}"
              )
          if failures:
              print("LIFECYCLE NON-REGRESSION BLOCKED:")
              print("\n".join(failures))
              sys.exit(1)
          print("OK: release-blocking lifecycle lanes passed: "
                + ", ".join(
                      f"{c}/{l}" + (f"#{f}" if f else "")
                      for c, l, f in sorted(release_blocking_seen)
                  ))
          lane_scope_outs = [
              f"{lane['core']}/{lane['language']}: {lane['release_scope_out_reason']}"
              for lane in data["lanes"]
              if lane.get("release_scope_out_reason")
          ]
          framework_scope_outs = [
              f"{row['core']}/{row['framework']}: {row['evidence']}"
              for row in data.get("framework_catalog", [])
              if row.get("status") == "scaffold-only"
          ]
          if lane_scope_outs:
              print(
                  "Lifecycle-scoped-out lanes (native-PM claims remain gated): "
                  + " | ".join(lane_scope_outs)
              )
          if framework_scope_outs:
              print(
                  "Explicitly scoped-out frameworks: "
                  + " | ".join(framework_scope_outs)
              )
          native_pm_qualified = [
              lane for lane in data["lanes"]
              if lane.get("dependency_owner") == "mgc-native"
              and lane.get("native_pm_verdict") == "native-pm-supported"
          ]
          native_pm_unqualified = [
              lane for lane in data["lanes"]
              if lane.get("dependency_owner") == "mgc-native"
              and lane.get("native_pm_verdict") != "native-pm-supported"
          ]
          print("Fully native-PM qualified lanes: "
                + (", ".join(
                    f"{lane['core']}/{lane['language']}"
                    + (f"#{lane.get('framework_id')}" if lane.get("framework_id") else "")
                    for lane in native_pm_qualified
                ) or "none"))
          if native_pm_unqualified:
              print("Native-PM claim withheld pending complete runtime evidence: "
                    + ", ".join(
                        f"{lane['core']}/{lane['language']}"
                        + (f"#{lane.get('framework_id')}" if lane.get("framework_id") else "")
                        for lane in native_pm_unqualified
                    ))

      # ── P0-3 platform evidence (Tech Lead 2026-09-16): Windows stays
      # evidence-only TODAY (the Enforce step above skips it), but the
      # evidence must ACCUMULATE — "experimental" must never rot into a
      # permanent state. Every fully-green Windows matrix run increments
      # the gitignored counter docs/specs/lifecyclePlatformEvidence.json
      # (--record-green; schema {os: {runs, last_green_sha, last_green_at}}),
      # persisted across runs via actions/cache (unique key per run +
      # restore-keys prefix = the latest streak wins). Any failed step on
      # the Windows runner zeroes the counter (--reset) so the count stays
      # CONSECUTIVE-green. When the counter reaches the promotion
      # threshold (3), the windows-evidence-promotion job below FAILS the
      # workflow: "Windows has enough evidence — flip it to required now".
      # Branch-scope note: actions/cache entries are branch-scoped — the
      # authoritative streak accumulates on the default branch (PR runs
      # see it, their saves never leak back).
      # (── P0-3 evidence platform (Tech Lead 2026-09-16): Windows vẫn
      # evidence-only HÔM NAY (bước Enforce trên bỏ qua nó) nhưng bằng
      # chứng phải TÍCH LŨY — "experimental" không được mục rữa thành trạng
      # thái vĩnh viễn. Mỗi lần chạy matrix Windows xanh trọn vẹn tăng
      # counter gitignored docs/specs/lifecyclePlatformEvidence.json
      # (--record-green; schema {os: {runs, last_green_sha,
      # last_green_at}}), giữ qua các lần chạy nhờ actions/cache (key
      # unique mỗi run + restore-keys prefix = lấy chuỗi mới nhất). Bất kỳ
      # bước nào fail trên runner Windows đều về 0 counter (--reset) để
      # con số luôn là lần XANH LIÊN TIẾP. Khi counter đạt ngưỡng promotion
      # (3), job windows-evidence-promotion bên dưới FAIL workflow:
      # "Windows has enough evidence — flip it to required now". Lưu ý
      # phạm-vi-branch: cache theo branch — chuỗi chính thức tích lũy trên
      # default branch (run PR nhìn thấy, không ghi ngược).)
      - name: Restore Windows platform-evidence counter (cross-run)
        if: matrix.os == 'windows-latest'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: docs/specs/lifecyclePlatformEvidence.json
          key: lifecycle-platform-evidence-windows-${{ github.run_id }}
          restore-keys: |
            lifecycle-platform-evidence-windows-

      # Default success() gating: a step after a failure is skipped — a
      # red Windows run NEVER records green evidence.
      # (success() mặc định: bước sau khi fail bị skip — lần chạy Windows
      # đỏ KHÔNG BAO GIỜ được ghi là xanh.)
      - name: Record Windows green matrix run (platform evidence)
        if: matrix.os == 'windows-latest'
        run: ${{ matrix.python_cmd }} scripts/lifecycle_capability_matrix.py --record-green "${{ matrix.os }}"
        env:
          MGC_PLATFORM_EVIDENCE_SHA: ${{ github.sha }}
          MGC_LIFECYCLE_MATRIX_OUT: docs/specs/lifecycleCapabilityMatrix.json

      - name: Save Windows platform-evidence counter (cross-run)
        if: matrix.os == 'windows-latest'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: docs/specs/lifecyclePlatformEvidence.json
          key: lifecycle-platform-evidence-windows-${{ github.run_id }}

      - name: Upload Windows platform evidence (promotion-gate input)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-evidence-windows
          path: docs/specs/lifecyclePlatformEvidence.json
          if-no-files-found: error

      # Consecutive-green contract: any failure on the Windows runner
      # breaks the streak — zero the counter (last_green_* history kept).
      # (Hợp đồng xanh-liên-tiếp: bất kỳ fail nào trên runner Windows đều
      # phá chuỗi — về 0 counter (giữ lịch sử last_green_*).)
      - name: Reset Windows evidence counter (streak broken)
        if: failure() && matrix.os == 'windows-latest'
        run: ${{ matrix.python_cmd }} scripts/lifecycle_capability_matrix.py --reset "${{ matrix.os }}"

      - name: Save reset Windows counter (cross-run)
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: docs/specs/lifecyclePlatformEvidence.json
          key: lifecycle-platform-evidence-windows-reset-${{ github.run_id }}

  windows-evidence-promotion:
    name: windows evidence promotion tripwire
    needs: [lifecycle-matrix]
    runs-on: ubuntu-latest
    # P0-3 self-enforcing promotion (Tech Lead 2026-09-16): Windows is
    # evidence-only TODAY, but "experimental" must never be permanent.
    # Once ≥3 CONSECUTIVE green Windows matrix runs are on record (the
    # counter above), this job FAILS the workflow with an explicit
    # instruction. The ONLY fix is the honest one: make the Windows lane
    # a required gate in the Enforce step (drop the
    # `matrix.os != 'windows-latest'` guard) and retire this job in the
    # same change. Runs only when the whole matrix job is green (default
    # needs gating); a missing/corrupt counter fails closed.
    # (P0-3 promotion tự-ép (Tech Lead 2026-09-16): Windows evidence-only
    # HÔM NAY, nhưng "experimental" không được thành vĩnh viễn. Khi đã ghi
    # ≥ 3 lần chạy matrix Windows xanh LIÊN TIẾP (counter bên trên), job
    # này FAIL workflow kèm chỉ dẫn tường minh. Cách sửa DUY NHẤT là cách
    # trung thực: biến lane Windows thành gate bắt buộc trong bước Enforce
    # (bỏ guard `matrix.os != 'windows-latest'`) và xoá job này trong cùng
    # thay đổi. Chỉ chạy khi job matrix xanh trọn vẹn (needs mặc định);
    # counter thiếu/hỏng thì fail-closed.)
    steps:
      - name: Download Windows platform evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: platform-evidence-windows
          path: docs/specs

      - name: Enforce Windows promotion threshold (flip to required at >=3)
        shell: python3 {0}
        run: |
          import json, sys

          PROMOTION_THRESHOLD = 3
          try:
              with open("docs/specs/lifecyclePlatformEvidence.json") as f:
                  data = json.load(f)
          except (OSError, ValueError) as exc:
              # Fail-closed: an unreadable counter cannot prove the
              # evidence is still immature.
              # (Fail-closed: counter không đọc được không chứng minh được
              # rằng bằng chứng còn non.)
              print(f"platform-evidence counter unreadable: {exc}")
              sys.exit(1)
          win = data.get("windows-latest") or {}
          runs = int(win.get("runs", 0))
          sha = win.get("last_green_sha", "unknown")
          at = win.get("last_green_at", "unknown")
          if runs >= PROMOTION_THRESHOLD:
              print(
                  "Windows has enough evidence — flip it to required now "
                  f"(consecutive green runs={runs}, last_green_sha={sha}, "
                  f"last_green_at={at})"
              )
              sys.exit(1)
          print(
              f"Windows evidence-only: {runs}/{PROMOTION_THRESHOLD} consecutive "
              f"green runs recorded (last_green_sha={sha}, last_green_at={at}) — "
              "promotion not due yet"
          )
