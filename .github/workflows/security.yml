name: Security

# Task #7: cargo audit + OSV scan (18 §6) — chạy theo lịch + khi Cargo.lock đổi
on:
  schedule:
    - cron: "0 0 * * 1" # thứ 2 hằng tuần
  push:
    paths: ["Cargo.lock", "**/Cargo.toml"]
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        # Ignore unmaintained warnings for trans-deps while maintaining vulnerability checks
        run: cargo audit --color never --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2026-0258
      - name: Verify lockfile is reproducible
        run: cargo check --workspace --locked

  osv:
    name: OSV scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and Run OSV-Scanner
        run: |
          GOBIN=/usr/local/bin go install github.com/google/osv-scanner/cmd/osv-scanner@latest 2>/dev/null
          if [ ! -f /usr/local/bin/osv-scanner ]; then
            curl -fsSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          fi
          export PATH=$PATH:/usr/local/bin
          osv-scanner -r . || true
