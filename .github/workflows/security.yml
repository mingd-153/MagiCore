name: Security

# Task #7: cargo audit + OSV scan (18 §6) — chạy theo lịch + khi Cargo.lock đổi
on:
  schedule:
    - cron: "0 0 * * 1" # thứ 2 hằng tuần
  push:
    paths: ["Cargo.lock", "**/Cargo.toml"]
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.20.1 --locked
      - name: Run audit
        # Ignore unmaintained warnings for trans-deps while maintaining vulnerability checks
        run: cargo audit --color never --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0235 --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2026-0258
      - name: Verify lockfile is reproducible
        run: cargo check --workspace --locked

  osv:
    name: OSV scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install and Run OSV-Scanner
        run: |
          OSV_VERSION="1.9.1"
          OSV_URL="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_${OSV_VERSION}_linux_amd64"
          OSV_SHA="6e9cb8e68c31c47e587ef24b5b86f1b05b9e6a66e19f1f68c92e73f16b4da866"

          # Download specific version with checksum
          curl -fsSL "$OSV_URL" -o /tmp/osv-scanner
          echo "${OSV_SHA}  /tmp/osv-scanner" | sha256sum --check
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner

          osv-scanner -r . --config=osv-scanner.toml
