name: Security

# Task #7: cargo audit + OSV scan (18 §6) — chạy theo lịch + khi Cargo.lock đổi
on:
  schedule:
    - cron: "0 0 * * 1" # thứ 2 hằng tuần
  push:
    paths: ["Cargo.lock", "**/Cargo.toml"]
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Prove advisory-only RSA is unreachable
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree -i rsa --workspace --all-features --target all | grep -q '^rsa '; then
            echo "RUSTSEC-2023-0071 is reachable from the compiled workspace"
            exit 1
          fi
      - name: Run audit
        # Ignore known unmaintained transitive crates and unreachable SQLx metadata only.
        # Chỉ bỏ qua crate gián tiếp không còn bảo trì và RSA không nằm trong graph biên dịch.
        run: cargo audit --color never --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2025-0134
      - name: Verify lockfile is reproducible
        run: cargo check --workspace --locked

  osv:
    name: OSV scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install and Run OSV-Scanner
        run: |
          OSV_VERSION="2.5.1"
          OSV_URL="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_${OSV_VERSION}_linux_amd64"
          OSV_SHA="f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be"

          # Download specific version with checksum
          curl -fsSL "$OSV_URL" -o /tmp/osv-scanner
          echo "${OSV_SHA}  /tmp/osv-scanner" | sha256sum --check
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          sudo chmod +x /usr/local/bin/osv-scanner

          osv-scanner scan source -r . --config osv-scanner.toml
