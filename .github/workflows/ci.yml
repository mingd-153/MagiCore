name: CI

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: mgc-exec allowlist tests
        run: cargo test -p mgc-exec --test test_run 2>&1
        timeout-minutes: 2
      - name: single-core web CLI surface
        run: cargo test -p mgc --no-default-features --features web test_single_core_create_alias_parses --quiet
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: module hygiene
        run: bash scripts/check-module-hygiene.sh
      - name: no npm/npx/pnpm/yarn/bun (L94)
        run: bash scripts/check-no-pm.sh
      - name: release hash updater syntax
        run: bash -n scripts/update-release-hashes.sh
      - name: package manifests syntax
        run: |
          ruby -c packaging/homebrew/magicore.rb
          ruby -c packaging/homebrew/magicore-web.rb
          python3 -m json.tool packaging/scoop/magicore.json >/dev/null
          python3 -m json.tool packaging/scoop/magicore-web.json >/dev/null
      - name: benchmark provenance
        run: python3 benchmark/scripts/verify_benchmark_provenance.py
      - name: internal specs stay ignored
        run: |
          git check-ignore -q docs/specs/magiCoreChangeLog.md
          git check-ignore -q docs/specs/preGitCICDHardening20260820.md

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --locked --exclude mgc --exclude mgc-e2e -- --test-threads=4
      - name: Seed registry + cargo test (mgc + mgc-e2e, skip benchmarks)
        run: |
          ./target/debug/mgc-registry --host 127.0.0.1 --port 4315 --store-dir /tmp/mgc-reg-store >/tmp/mgc-reg.log 2>&1 &
          SRV=$!
          trap 'kill $SRV' EXIT
          for i in $(seq 1 15); do curl -sf -o /dev/null http://127.0.0.1:4315/ && break || sleep 1; done
          mkdir -p /tmp/mgc-tpl && git archive 1b69dd0^ templates | tar -x -C /tmp/mgc-tpl
          node -e '
            const fs = require("fs"), path = require("path");
            const root = "/tmp/mgc-tpl/templates";
            let ok = 0, fail = 0;
            function walk(d) {
              for (const f of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, f.name);
                if (f.isDirectory()) { walk(p); continue; }
                if (!f.isSymbolicLink()) continue;
                let tgt = fs.readlinkSync(p);
                let resolved;
                if (tgt.startsWith("/")) {
                  const i = tgt.indexOf("/templates/");
                  if (i < 0) { fail++; continue; }
                  resolved = path.join(root, tgt.slice(i + "/templates/".length));
                } else { resolved = path.resolve(path.dirname(p), tgt); }
                try { fs.rmSync(p); fs.cpSync(resolved, p, { recursive: true, verbatimSymlinks: false }); ok++; }
                catch (e) { fail++; }
              }
            }
            walk(root);
            console.log(`resolved symlinks: ${ok} ok, ${fail} skipped`);
          '
          mkdir -p /tmp/mgc-tpl/templates/web/backend/php/laravel/sources/storage/logs
          touch /tmp/mgc-tpl/templates/web/backend/php/laravel/sources/storage/logs/.gitkeep
          printf 'APP_ENV=dev\nAPP_DEBUG=1\nAPP_SECRET=changeme\nAPP_NAME={{project_name}}\n' > /tmp/mgc-tpl/templates/web/backend/php/symfony/sources/.env
          MAGICORE_TEMPLATE_DIR=/tmp/mgc-tpl/templates MGC_NPM_REGISTRY=http://127.0.0.1:4315 cargo run -p mgc -- template publish-all
          mkdir -p /tmp/mgc-empty-cache
          MGC_NPM_REGISTRY=http://127.0.0.1:4315 MGC_TEMPLATES_DIR=/tmp/mgc-empty-cache cargo test -p mgc -p mgc-e2e --locked -- --test-threads=4 --skip bench_

  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --all-targets --locked

  test-with-runtimes:
    name: Test with Full Runtime Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            python-setup: |
              sudo apt-get update
              sudo apt-get install -y python3 python3-pip nodejs npm
              pip3 install pytest
          - os: macos-latest
            python-setup: |
              brew install python3 node
              pip3 install pytest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: Setup Python + Node runtimes
        run: ${{ matrix.python-setup }}

      - name: Verify runtimes available
        run: |
          python3 --version
          pytest --version
          node --version
          npm --version
          flutter --version
          flutter doctor -v

      - name: Build mgc binary
        run: cargo build -p mgc --locked

      - name: Run security tests
        run: cargo test -p mgc --test test_runner_security --locked

      - name: Run optimizer tests (MUST PASS - no || true)
        run: cargo test -p mgc --test optimizer_lifecycle_e2e --locked -- --nocapture

      - name: Run lifecycle tests (MUST PASS - no || true)
        run: cargo test -p mgc --test full_lifecycle_e2e --locked -- --nocapture

      - name: Run cache stress tests (MUST PASS)
        run: cargo test -p mgc --test cache_stress_test --locked -- --nocapture

      - name: Run CLI surface tests (MUST PASS)
        run: cargo test -p mgc --test cli_surface_errors_test --locked -- --nocapture

      - name: Summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          echo "Runtimes provisioned: Python3, pytest, Node, npm, Flutter"
          echo "Expected: AI optimizer + App tests now PASS"
          echo "Still UNVERIFIED: Web (templates)"
