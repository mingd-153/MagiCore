name: CI

on:
  push:
    branches: [main, development, "feature/**", "fix/**"]
  pull_request:
    branches: [main, development]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: mgc-exec allowlist tests
        run: cargo test -p mgc-exec --test test_run 2>&1
        timeout-minutes: 2

  windows-spawn-tests:
    name: Windows Spawn Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Setup Node.js (for spawn tests)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Flutter (for .bat spawn tests)
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0 (latest, node24)
        with:
          flutter-version: "3.47.2"
          channel: "stable"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Windows spawn tests
        shell: bash
        run: |
          echo "=== Windows Tool Resolution ==="
          where.exe node || echo "Node not found"
          where.exe flutter || echo "Flutter not found"
          where.exe gradle || echo "Gradle not found (expected)"
          where.exe swift || echo "Swift not found (expected)"
          echo ""

          echo "=== Running mgc-exec Windows Tests ==="
          cargo test -p mgc-exec --test windows_spawn_test --test multiplatform_tools_test -- --nocapture
        timeout-minutes: 5
      - name: single-core web CLI surface
        run: cargo test -p mgc --no-default-features --features web test_single_core_create_alias_parses --quiet
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: module hygiene
        run: bash scripts/check-module-hygiene.sh
      - name: no npm/npx/pnpm/yarn/bun (L94)
        run: bash scripts/check-no-pm.sh
      - name: release hash updater syntax
        run: bash -n scripts/update-release-hashes.sh
      - name: package manifests syntax
        # Windows fix (2026-09-11): this job's default shell on Windows
        # is pwsh — `>/dev/null` is a bash-ism that pwsh misreads as the
        # path D:\dev\null. Force bash for the POSIX redirect syntax.
        # Fix Windows: shell mặc định của job này trên Windows là pwsh —
        # `>/dev/null` là cú pháp bash mà pwsh hiểu nhầm thành đường dẫn
        # D:\dev\null. Ép bash cho cú pháp redirect POSIX.
        shell: bash
        run: |
          ruby -c packaging/homebrew/magicore.rb
          ruby -c packaging/homebrew/magicore-web.rb
          python3 -m json.tool packaging/scoop/magicore.json >/dev/null
          python3 -m json.tool packaging/scoop/magicore-web.json >/dev/null
      - name: benchmark provenance
        run: python3 benchmark/scripts/verify_benchmark_provenance.py
      - name: analyzer regression tests
        run: python3 benchmark/scripts/test_analyzer_strict.py
      - name: manifest updater integration tests
        run: bash scripts/test_manifest_updater.sh
      - name: internal specs stay ignored
        run: |
          git check-ignore -q docs/specs/magiCoreChangeLog.md
          git check-ignore -q docs/specs/preGitCICDHardening20260820.md

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)
      - name: cargo test
        run: cargo test --workspace --locked --exclude mgc --exclude mgc-e2e -- --test-threads=4
      - name: Seed registry + cargo test (mgc + mgc-e2e, skip benchmarks)
        run: |
          ./target/debug/mgc-registry --host 127.0.0.1 --port 4315 --store-dir /tmp/mgc-reg-store >/tmp/mgc-reg.log 2>&1 &
          SRV=$!
          trap 'kill $SRV' EXIT
          for i in $(seq 1 15); do curl -sf -o /dev/null http://127.0.0.1:4315/ && break || sleep 1; done
          mkdir -p /tmp/mgc-tpl && git archive 1b69dd0^ templates | tar -x -C /tmp/mgc-tpl
          node -e '
            const fs = require("fs"), path = require("path");
            const root = "/tmp/mgc-tpl/templates";
            let ok = 0, fail = 0;
            function walk(d) {
              for (const f of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, f.name);
                if (f.isDirectory()) { walk(p); continue; }
                if (!f.isSymbolicLink()) continue;
                let tgt = fs.readlinkSync(p);
                let resolved;
                if (tgt.startsWith("/")) {
                  const i = tgt.indexOf("/templates/");
                  if (i < 0) { fail++; continue; }
                  resolved = path.join(root, tgt.slice(i + "/templates/".length));
                } else { resolved = path.resolve(path.dirname(p), tgt); }
                try { fs.rmSync(p); fs.cpSync(resolved, p, { recursive: true, verbatimSymlinks: false }); ok++; }
                catch (e) { fail++; }
              }
            }
            walk(root);
            console.log(`resolved symlinks: ${ok} ok, ${fail} skipped`);
          '
          mkdir -p /tmp/mgc-tpl/templates/web/backend/php/laravel/sources/storage/logs
          touch /tmp/mgc-tpl/templates/web/backend/php/laravel/sources/storage/logs/.gitkeep
          printf 'APP_ENV=dev\nAPP_DEBUG=1\nAPP_SECRET=changeme\nAPP_NAME={{project_name}}\n' > /tmp/mgc-tpl/templates/web/backend/php/symfony/sources/.env
          MAGICORE_TEMPLATE_DIR=/tmp/mgc-tpl/templates MGC_NPM_REGISTRY=http://127.0.0.1:4315 cargo run -p mgc -- template publish-all
          mkdir -p /tmp/mgc-empty-cache
          MGC_NPM_REGISTRY=http://127.0.0.1:4315 MGC_TEMPLATES_DIR=/tmp/mgc-empty-cache cargo test -p mgc -p mgc-e2e --locked -- --test-threads=4 --skip bench_

  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)
      - name: cargo build --release
        run: cargo build --release --all-targets --locked

  test-with-runtimes:
    name: Test with Full Runtime Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            python-setup: |
              sudo apt-get update
              sudo apt-get install -y python3 python3-pip nodejs npm
              pip3 install pytest
          - os: macos-latest
            python-setup: |
              brew install python3 node go
              pip3 install --break-system-packages pytest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (latest)

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          # Keep this matrix aligned with all-core lifecycle and Windows spawn CI.
          # Đồng bộ runtime với lifecycle all-core và Windows spawn CI.
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Setup Python + Node runtimes
        run: ${{ matrix.python-setup }}

      - name: Verify runtimes available
        run: |
          python3 --version
          pytest --version
          node --version
          npm --version
          flutter --version
          flutter doctor -v
          go version || echo "Go not available"

      - name: Build mgc binary
        run: cargo build -p mgc --locked

      - name: Run security tests
        run: cargo test -p mgc --test test_runner_security --locked

      - name: Run optimizer tests (MUST PASS - no || true)
        run: cargo test -p mgc --test optimizer_lifecycle_e2e --locked -- --nocapture

      - name: Run lifecycle tests (MUST PASS - no || true)
        run: cargo test -p mgc --test full_lifecycle_e2e --locked -- --nocapture

      - name: Run cache stress tests (MUST PASS)
        run: cargo test -p mgc --test cache_stress_test --locked -- --nocapture

      - name: Run CLI surface tests (MUST PASS)
        run: cargo test -p mgc --test cli_surface_errors_test --locked -- --nocapture

      - name: Run install smoke tests (MUST PASS)
        run: cargo test -p mgc --test install_smoke_test --locked -- --nocapture

      - name: Summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          echo "Runtimes provisioned: Python3, pytest, Node, npm, Flutter"
          echo "All E2E tests running with REAL mgc commands"
          echo "Install smoke tests: structure verified"
