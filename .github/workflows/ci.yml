name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: mg-exec allowlist tests
        run: cargo test -p mg-exec --test test_run 2>&1
        timeout-minutes: 2
      - name: single-core web CLI surface
        run: cargo test -p mg --no-default-features --features web test_single_core_create_alias_parses --quiet
      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: module hygiene
        run: bash scripts/check-module-hygiene.sh
      - name: no npm/npx/pnpm/yarn/bun (L94)
        run: bash scripts/check-no-pm.sh
      - name: release hash updater syntax
        run: bash -n scripts/update-release-hashes.sh
      - name: package manifests syntax
        run: |
          ruby -c packaging/homebrew/megagate.rb
          ruby -c packaging/homebrew/megagate-web.rb
          python3 -m json.tool packaging/scoop/megagate.json >/dev/null
          python3 -m json.tool packaging/scoop/megagate-web.json >/dev/null
      - name: internal specs stay ignored
        run: |
          git check-ignore -q docs/specs/megaGateChangeLog.md
          git check-ignore -q docs/specs/preGitCICDHardening20260820.md

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --locked --exclude mg -- --test-threads=4
      - name: Seed registry + cargo test (mg, skip benchmarks)
        run: |
          ./target/debug/mg-registry --host 127.0.0.1 --port 4315 --store-dir /tmp/mg-reg-store >/tmp/mg-reg.log 2>&1 &
          SRV=$!
          trap 'kill $SRV' EXIT
          for i in $(seq 1 15); do curl -sf -o /dev/null http://127.0.0.1:4315/ && break || sleep 1; done
          mkdir -p /tmp/mg-tpl && git archive 1b69dd0^ templates | tar -x -C /tmp/mg-tpl
          node -e '
            const fs = require("fs"), path = require("path");
            const root = "/tmp/mg-tpl/templates";
            let ok = 0, fail = 0;
            function walk(d) {
              for (const f of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, f.name);
                if (f.isDirectory()) { walk(p); continue; }
                if (!f.isSymbolicLink()) continue;
                let tgt = fs.readlinkSync(p);
                let resolved;
                if (tgt.startsWith("/")) {
                  const i = tgt.indexOf("/templates/");
                  if (i < 0) { fail++; continue; }
                  resolved = path.join(root, tgt.slice(i + "/templates/".length));
                } else { resolved = path.resolve(path.dirname(p), tgt); }
                try { fs.rmSync(p); fs.cpSync(resolved, p, { recursive: true, verbatimSymlinks: false }); ok++; }
                catch (e) { fail++; }
              }
            }
            walk(root);
            console.log(`resolved symlinks: ${ok} ok, ${fail} skipped`);
          '
          mkdir -p /tmp/mg-tpl/templates/web/backend/php/laravel/sources/storage/logs
          touch /tmp/mg-tpl/templates/web/backend/php/laravel/sources/storage/logs/.gitkeep
          printf 'APP_ENV=dev\nAPP_DEBUG=1\nAPP_SECRET=changeme\nAPP_NAME={{project_name}}\n' > /tmp/mg-tpl/templates/web/backend/php/symfony/sources/.env
          MEGAGATE_TEMPLATE_DIR=/tmp/mg-tpl/templates MG_NPM_REGISTRY=http://127.0.0.1:4315 cargo run -p mg -- template publish-all
          mkdir -p /tmp/mg-empty-cache
          MG_NPM_REGISTRY=http://127.0.0.1:4315 MG_TEMPLATES_DIR=/tmp/mg-empty-cache cargo test -p mg --locked -- --test-threads=4 --skip bench_

  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --all-targets --locked
