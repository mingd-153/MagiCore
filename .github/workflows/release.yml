name: MegaGate Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.package }} / ${{ matrix.target-label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            target-label: Linux-X64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            target-label: Linux-ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            target-label: macOS-ARM64
          - os: macos-latest
            target: x86_64-apple-darwin
            target-label: macOS-X64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target-label: Windows-X64
        package: [megagate, megagate-web]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo run -p mg-dist -- build ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          pkg="${{ matrix.package }}"
          label="${{ matrix.target-label }}"
          cd "dist/$pkg"
          target_dir=$(ls -d */ | head -1)
          mv "$target_dir" "$pkg"
          tar czf "../${pkg}-${label}.tar.gz" "$pkg/"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*.tar.gz
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: MegaGate ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/assets/*
          generate_release_notes: true
