name: Debug Exec Cancel

on:
  push:
    branches: [debug/exec-cancel]

jobs:
  repro:
    name: Reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: test 1st (full compile)
        run: cargo test -p mg-exec --test test_run command_timeout_kills_hung_tool 2>&1
      - name: test 2nd (cached artifacts)
        run: cargo test -p mg-exec --test test_run command_timeout_kills_hung_tool 2>&1
      - name: test 3rd (cached artifacts)
        run: cargo test -p mg-exec --test test_run command_timeout_kills_hung_tool 2>&1