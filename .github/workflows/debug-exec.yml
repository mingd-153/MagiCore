name: Debug Exec Cancel

on:
  push:
    branches: [debug/exec-cancel]

jobs:
  repro:
    name: Reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: shell kill test
        run: |
          echo "=== before ==="
          echo "shell pid: $$"
          sh -c 'sleep 2' &
          CHILD=$!
          echo "child pid: $CHILD"
          sleep 0.05
          echo "=== kill now: kill -TERM -$CHILD $CHILD ==="
          kill -TERM -$CHILD $CHILD
          echo "=== after kill (still alive) ==="
          sleep 2
          echo "=== done ==="