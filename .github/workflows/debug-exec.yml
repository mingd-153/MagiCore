name: Debug Exec Cancel

on:
  push:
    branches: [debug/exec-cancel]

jobs:
  repro:
    name: Reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: mg-exec allowlist tests
        run: cargo test -p mg-exec --test test_run 2>&1
      - name: mg-exec allowlist tests run2
        run: cargo test -p mg-exec --test test_run 2>&1