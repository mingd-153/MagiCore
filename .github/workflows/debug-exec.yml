name: Debug Exec Cancel

on:
  push:
    branches: [debug/exec-cancel]

jobs:
  repro:
    name: Reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: mg-exec allowlist tests
        run: cargo test -p mg-exec --test test_run 2>&1
        timeout-minutes: 2
      - name: single-core web CLI surface
        run: cargo test -p mg --no-default-features --features web test_single_core_create_alias_parses --quiet
      - name: cargo check
        run: cargo check --workspace --all-targets --locked