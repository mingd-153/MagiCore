name: Debug Exec Cancel

on:
  push:
    branches: [debug/exec-cancel]

jobs:
  repro:
    name: Reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: wait for clippy process tree death
        run: sleep 15
      - name: mg-exec allowlist tests
        run: cargo test -p mg-exec --test test_run 2>&1
      - name: mg-exec allowlist tests run2
        run: cargo test -p mg-exec --test test_run 2>&1