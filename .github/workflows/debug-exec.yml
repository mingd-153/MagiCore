name: Debug Exec Cancel

on:
  push:
    branches: [debug/exec-cancel]

jobs:
  repro:
    name: Reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy tests only
        run: cargo clippy --workspace --tests --locked -- -D warnings
      - name: command_timeout test with strace
        run: |
          sudo apt-get update -y -q && sudo apt-get install -y -q strace
          trap 'echo "===TRACE==="; tail -80 /tmp/trace.log' EXIT
          strace -f -e trace=kill,killpg,setpgid,setsid -o /tmp/trace.log \
            cargo test -p mg-exec --test test_run command_timeout_kills_hung_tool -- --nocapture 2>&1
          echo "TEST_EXIT=$?"
          echo "===TRACE==="
          tail -80 /tmp/trace.log