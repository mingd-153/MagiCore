[[files]]
source = "package.json"
target = "package.json"
required_context = ["project_slug"]

[[files]]
source = "app.html"
target = "src/app.html"

[[files]]
source = "+page.svelte"
target = "src/routes/+page.svelte"
required_context = ["project_name"]

[[files]]
source = "+layout.svelte"
target = "src/routes/+layout.svelte"

[[files]]
source = "app.css"
target = "src/app.css"

[[files]]
source = "jsconfig.json"
target = "jsconfig.json"
exclude_features = ["typescript"]

[[files]]
source = "tsconfig.json"
target = "tsconfig.json"
include_features = ["typescript"]

[[files]]
source = "vite-env.d.ts"
target = "src/vite-env.d.ts"
include_features = ["typescript"]

[[files]]
source = "vite.config.js"
target = "vite.config.js"
exclude_features = ["typescript"]

[[files]]
source = "vite.config.ts"
target = "vite.config.ts"
include_features = ["typescript"]

[[files]]
source = "svelte.config.js"
target = "svelte.config.js"
exclude_features = ["typescript"]

[[files]]
source = "svelte.config.ts"
target = "svelte.config.ts"
include_features = ["typescript"]

[[files]]
source = "config/framework.js"
target = "src/config/framework.js"
exclude_features = ["typescript"]

[[files]]
source = "config/framework.ts"
target = "src/config/framework.ts"
include_features = ["typescript"]
