name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MegaGate web core
        run: curl -fsSL https://raw.githubusercontent.com/mingd-153/MegaGate/main/scripts/install-from-gh.sh | bash -s -- --package megagate-web --dir "$HOME/.local/bin"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mg install --frozen
      - run: mg run lint
      - run: mg build
