# MegaGate Registry — Nginx Reverse Proxy
# Location: deploy/nginx/megagate.conf
#
# Usage (production):
#   1. Copy this file to /etc/nginx/sites-available/megagate
#   2. Set DOMAIN and certificate paths below (or use certbot)
#   3. ln -s /etc/nginx/sites-available/megagate /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# Requires:
#   - Nginx ≥ 1.20
#   - mg-registry-server running on 127.0.0.1:8080 (see deploy/docker/docker-compose.yml)
#   - TLS cert/key (Let's Encrypt: certbot --nginx -d registry.example.com)

# ─────────────────────────────────────────────────────────────────────────────
# CONFIG — edit these values
# ─────────────────────────────────────────────────────────────────────────────
# Replace registry.example.com with your actual domain
# Replace /etc/letsencrypt/... with your actual cert paths

upstream mg_registry {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name registry.example.com;

    # Let's Encrypt ACME challenge passthrough
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (TLS termination) ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name registry.example.com;

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/registry.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.example.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # TLS ≥ 1.2 (sys-mg/12 §10)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # HSTS (1 year — only after verifying TLS works)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-Frame-Options          "DENY"          always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "no-referrer"   always;

    # Token MUST travel only in Authorization header — never in URL (sys-mg/12 §10)
    # Strip Authorization from logs
    set $auth_log "-";

    # ── Upload size — package tarballs can be large ──────────────────────────
    client_max_body_size 512m;

    # ── Timeouts (aligned with mg-http §4) ──────────────────────────────────
    proxy_connect_timeout    10s;
    proxy_send_timeout       60s;
    proxy_read_timeout       300s;   # streaming/large tarball uploads

    # ── Proxy settings ───────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Connection     "";
    proxy_set_header   Host           $host;
    proxy_set_header   X-Real-IP      $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;

    # ── npm registry API (/npm/*) ─────────────────────────────────────────────
    # All npm-format requests: publish, install, dist-tags
    location /npm/ {
        proxy_pass http://mg_registry/npm/;
        proxy_buffering off;         # stream large responses
    }

    # ── OCI Distribution API (/v2/*) ─────────────────────────────────────────
    # Model blobs, OCI artifacts (ai core / iot firmware)
    location /v2/ {
        proxy_pass http://mg_registry/v2/;
        proxy_buffering off;

        # OCI chunked upload support
        proxy_request_buffering off;
    }

    # ── Admin API (/v2/admin/*) ──────────────────────────────────────────────
    # Restrict admin endpoints to internal IPs only
    location /v2/admin/ {
        # Allow only localhost and internal network — adjust to your CIDR
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://mg_registry/v2/admin/;
    }

    # ── Health check (public — used by Docker healthcheck) ───────────────────
    location = /v2/ {
        proxy_pass http://mg_registry/v2/;
        access_log off;
    }

    # ── Block dangerous paths ────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Access log (Authorization header stripped) ────────────────────────────
    access_log /var/log/nginx/megagate_access.log combined;
    error_log  /var/log/nginx/megagate_error.log warn;
}
