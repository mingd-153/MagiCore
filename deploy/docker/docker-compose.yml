# MagiCore — Docker Compose
# Runs mgc-registry-server + optional mgc CLI sidecar.
#
# Quick start:
#   cp registry.env.example registry.env          # fill in secrets
#   docker compose up -d
#   docker compose logs -f registry
#
# Production (with Nginx TLS):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: magicore

services:
  # ── Registry server ────────────────────────────────────────────────────────
  registry:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.registry
    image: magicore/registry-server:latest
    container_name: mgc-registry
    restart: unless-stopped
    ports:
      - "${MAGICORE_REGISTRY_PORT:-8080}:8080"
    volumes:
      - registry-data:/data
    env_file:
      - registry.env
    environment:
      MAGICORE_REGISTRY_HOST: "0.0.0.0"
      MAGICORE_REGISTRY_PORT: "8080"
      MAGICORE_REGISTRY_STORE_DIR: "/data"
      MAGICORE_LOG_LEVEL: "${MAGICORE_LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - mgc-internal

  # ── mgc CLI sidecar (one-shot) ──────────────────────────────────────────────
  # Usage:  docker compose run --rm mgc-cli mgc publish ./my-pkg
  mgc-cli:
    image: magicore/cli:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mgc-cli
    profiles:
      - cli
    depends_on:
      registry:
        condition: service_healthy
    environment:
      MGC_REGISTRY: "http://registry:8080"
      MGC_AUTH_TOKEN: "${MGC_AUTH_TOKEN:-}"
    volumes:
      - "${HOST_WORKSPACE:-./workspace}:/workspace:rw"
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/mgc"]
    networks:
      - mgc-internal

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  registry-data:
    driver: local
    driver_opts:
      type: none
      device: "${REGISTRY_DATA_PATH:-./data}"
      o: bind

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  mgc-internal:
    driver: bridge
