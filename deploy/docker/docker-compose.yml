# MagiCore — Docker Compose
# Runs mgc-registry-server + optional mgc CLI sidecar.
#
# Quick start:
#   cp registry.env.example registry.env          # fill in secrets
#   cp .env.example .env                          # optional CLI sidecar token
#   docker compose up -d
#   docker compose logs -f registry
#
# Production (with Nginx TLS):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: magicore

services:
  # ── Registry server ────────────────────────────────────────────────────────
  registry:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.registry
    image: magicore/registry-server:latest
    container_name: mgc-registry
    restart: unless-stopped
    # Host API port is loopback-only; remote clients must use the TLS proxy.
    # Port trên host chỉ mở loopback; client từ xa phải đi qua TLS proxy.
    ports:
      - "127.0.0.1:${MAGICORE_REGISTRY_PORT:-4315}:4315"
    volumes:
      - registry-data:/data
    env_file:
      - registry.env
    environment:
      MAGICORE_REGISTRY_HOST: "0.0.0.0"
      MAGICORE_REGISTRY_PORT: "4315"
      MAGICORE_REGISTRY_STORE_DIR: "/data"
      MAGICORE_LOG_LEVEL: "${MAGICORE_LOG_LEVEL:-info}"
    healthcheck:
      # Accept the expected auth challenge; keep other Wget failures unhealthy.
      # Chấp nhận thử thách xác thực dự kiến; các lỗi Wget khác vẫn báo unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4315/v2/ >/dev/null 2>&1 || test $$? -eq 6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - mgc-internal

  # ── mgc CLI sidecar (one-shot) ──────────────────────────────────────────────
  # Usage:  docker compose run --rm mgc-cli mgc publish ./my-pkg
  # Optional publish token: set MGC_NPM_TOKEN in .env before using --profile cli.
  # Token publish tùy chọn: đặt MGC_NPM_TOKEN trong .env trước khi dùng --profile cli.
  mgc-cli:
    image: magicore/cli:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mgc-cli
    profiles:
      - cli
    depends_on:
      registry:
        condition: service_healthy
    environment:
      MGC_REGISTRY: "http://registry:4315"
      MGC_NPM_TOKEN: "${MGC_NPM_TOKEN:-}"
    volumes:
      - "${HOST_WORKSPACE:-./workspace}:/workspace:rw"
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/mgc"]
    networks:
      - mgc-internal

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  registry-data:
    driver: local
    driver_opts:
      type: none
      device: "${REGISTRY_DATA_PATH:-./data}"
      o: bind

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  mgc-internal:
    driver: bridge
