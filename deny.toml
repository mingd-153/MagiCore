[advisories]
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2025-0119",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0002",
]

[bans]
multiple-versions = "deny"
skip = [
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "windows_aarch64_gnullvm" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_i686_gnu" },
    { name = "windows_i686_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_msvc" },
    { name = "hashbrown" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "core-foundation" },
    { name = "getrandom" },
    { name = "linux-raw-sys" },
    { name = "rustix" },
    { name = "unicode-width", version = "0.1" },
    { name = "cpufeatures" },
]

[sources]
unknown-registry = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
]
