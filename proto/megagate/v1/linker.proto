syntax = "proto3";

package megagate.v1;

option go_package = "github.com/megagate/megagate/gen/go/megagate/v1;v1";
option java_package = "dev.megagate.v1";
option java_multiple_files = true;
option csharp_namespace = "Megagate.V1";

import "common.proto";
import "package.proto";

message LinkRequest {
    string importer_path = 1;
    Lockfile lockfile = 2;
    LinkStrategy strategy = 3;
}

message LinkResponse {
    bool success = 1;
    string error = 2;
}

enum LinkStrategy {
    LINK_STRATEGY_UNSPECIFIED = 0;
    LINK_STRATEGY_HARDLINK = 1;
    LINK_STRATEGY_SYMLINK = 2;
    LINK_STRATEGY_COPY = 3;
}

message UnlinkRequest {
    string importer_path = 1;
    string package_name = 2;
}

message UnlinkResponse {
    bool success = 1;
    string error = 2;
}

message CleanRequest {
    string importer_path = 1;
}

message CleanResponse {
    bool success = 1;
    string error = 2;
}