syntax = "proto3";

package megagate.v1;

option go_package = "github.com/megagate/megagate/gen/go/megagate/v1;v1";
option java_package = "dev.megagate.v1";
option java_multiple_files = true;
option csharp_namespace = "Megagate.V1";

import "common.proto";
import "package.proto";

message FetchRequest {
    ResolvedDependency package = 1;
    FetcherConfig config = 2;
}

message FetchResponse {
    bool success = 1;
    IntegrityInfo integrity_info = 2;
    string error = 3;
}

message FetchMultipleRequest {
    repeated ResolvedDependency packages = 1;
    FetcherConfig config = 2;
}

message FetchMultipleResponse {
    repeated FetchResult results = 1;
    bool success = 2;
    string error = 3;
}

message FetchResult {
    ResolvedDependency package = 1;
    IntegrityInfo integrity_info = 2;
    bool success = 3;
    string error = 4;
}

message FetcherConfig {
    int32 max_concurrency = 1;
    int32 timeout_seconds = 2;
    int32 retry_count = 3;
    int32 retry_delay_seconds = 4;
    int32 rate_limit = 5;
}

message RegistryConfig {
    string url = 1;
    int32 timeout_seconds = 2;
}
