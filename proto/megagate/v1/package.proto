syntax = "proto3";

package megagate.v1;

option go_package = "github.com/megagate/megagate/gen/go/megagate/v1;v1";
option java_package = "dev.megagate.v1";
option java_multiple_files = true;
option csharp_namespace = "Megagate.V1";

import "common.proto";

message PackageRef {
    string name = 1;
    string version = 2;
}

message PackageManifest {
    string name = 1;
    string version = 2;
    string description = 3;
    map<string, string> dependencies = 4;
    map<string, string> dev_dependencies = 5;
    map<string, string> optional_dependencies = 6;
    map<string, string> peer_dependencies = 7;
    map<string, PeerDepMeta> peer_dependencies_meta = 8;
    map<string, string> bin = 9;
    map<string, string> scripts = 10;
    map<string, string> engines = 11;
    repeated string files = 12;
    string main = 13;
    string module = 14;
    string types = 15;
    google.protobuf.Value exports = 16;
    google.protobuf.Value side_effects = 17;
    MegagatePackageConfig megagate = 18;
}

message PeerDepMeta {
    bool optional = 1;
}

message MegagatePackageConfig {
    bool lockdown = 1;
    repeated string entry_points = 2;
    repeated string test_entry_points = 3;
}

message LockedPackage {
    string name = 1;
    string version = 2;
    string integrity = 3;
    string resolved = 4;
    uint64 size = 5;
    map<string, string> dependencies = 6;
    map<string, string> optional_dependencies = 7;
    map<string, string> peer_dependencies = 8;
    map<string, string> bin = 9;
    map<string, string> engines = 10;
    ProvenanceInfo provenance = 11;
    repeated string approved_builds = 12;
    google.protobuf.Timestamp publish_time = 13;
}

message ProvenanceInfo {
    string repository_url = 1;
    string commit_hash = 2;
    string builder_id = 3;
    string signature = 4;
}

message ResolvedDependency {
    string name = 1;
    string version = 2;
    string integrity = 3;
    string resolved = 4;
    uint64 size = 5;
    map<string, string> dependencies = 6;
    map<string, string> optional_dependencies = 7;
    map<string, string> peer_dependencies = 8;
    map<string, string> bin = 9;
    map<string, string> engines = 10;
    google.protobuf.Timestamp publish_time = 11;
}