syntax = "proto3";

package megagate.v1;

option go_package = "github.com/megagate/megagate/gen/go/megagate/v1;v1";
option java_package = "dev.megagate.v1";
option java_multiple_files = true;
option csharp_namespace = "Megagate.V1";

import "common.proto";
import "package.proto";

message StoreInitRequest {
    string store_dir = 1;
}

message StoreInitResponse {
    bool success = 1;
    string error = 2;
}

message StoreExistsRequest {
    PackageRef package_ref = 1;
}

message StoreExistsResponse {
    bool exists = 1;
}

message StoreGetPathRequest {
    PackageRef package_ref = 1;
}

message StoreGetPathResponse {
    string path = 1;
}

message StoreWriteTarballRequest {
    PackageRef package_ref = 1;
    bytes tarball_data = 2;
}

message StoreWriteTarballResponse {
    IntegrityInfo integrity_info = 1;
    bool success = 2;
    string error = 3;
}

message StoreReadTarballRequest {
    PackageRef package_ref = 1;
}

message StoreReadTarballResponse {
    bytes tarball_data = 1;
    bool success = 2;
    string error = 3;
}

message StoreWriteManifestRequest {
    PackageRef package_ref = 1;
    PackageManifest manifest = 2;
}

message StoreWriteManifestResponse {
    bool success = 1;
    string error = 2;
}

message StoreReadManifestRequest {
    PackageRef package_ref = 1;
}

message StoreReadManifestResponse {
    PackageManifest manifest = 1;
    bool found = 2;
    string error = 3;
}

message StoreWriteMetadataRequest {
    PackageRef package_ref = 1;
    PackageMetadata metadata = 2;
}

message StoreWriteMetadataResponse {
    bool success = 1;
    string error = 2;
}

message StoreReadMetadataRequest {
    PackageRef package_ref = 1;
}

message StoreReadMetadataResponse {
    PackageMetadata metadata = 1;
    bool found = 2;
    string error = 3;
}

message StoreCreateHardlinkRequest {
    PackageRef package_ref = 1;
    string target = 2;
}

message StoreCreateHardlinkResponse {
    bool success = 1;
    string error = 2;
}

message StoreCreateSymlinkRequest {
    PackageRef package_ref = 1;
    string target = 2;
}

message StoreCreateSymlinkResponse {
    bool success = 1;
    string error = 2;
}

message StoreRemoveRequest {
    PackageRef package_ref = 1;
}

message StoreRemoveResponse {
    bool success = 1;
    string error = 2;
}

message StorePruneRequest {
    map<string, PackageRef> referenced = 1;
}

message StorePruneResponse {
    int32 removed = 1;
    int64 freed_bytes = 2;
    bool success = 3;
    string error = 4;
}

message StoreVerifyIntegrityRequest {
    PackageRef package_ref = 1;
}

message StoreVerifyIntegrityResponse {
    bool valid = 1;
    string actual_integrity = 2;
}

message PackageMetadata {
    string integrity = 1;
    uint64 size = 2;
    google.protobuf.Timestamp extracted_at = 3;
    google.protobuf.Timestamp publish_time = 4;
    repeated string approved_builds = 5;
}