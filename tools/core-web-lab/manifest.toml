version = 1
name = "core-web-platform-lab"
branch = "core-web-platform-lab"
base_branch = "development"

[surface]
name = "core-web"
paths = [
  "adapters/web",
  "cli/src/commands/core/web.rs",
  "cli/src/wizard/web.rs",
  "templates/web",
  "scripts/bench.sh",
  "scripts/bench-ci.sh",
]

[outputs]
graph = "tools/core-web-lab/graph"
indexes = "tools/core-web-lab/indexes"
manifests = "tools/core-web-lab/manifests"
reports = "tools/core-web-lab/reports"
benchmarks = "tools/core-web-lab/benchmarks"
security = "tools/core-web-lab/security"

[external_tools]
code_graph_primary = "RepoGraph"
code_graph_secondary = "OpenGrok"
search_optional = "Zoekt"
benchmark_primary = "hyperfine"
sbom_primary = "syft"
security_secret = "gitleaks"
security_vuln = "trivy"
security_python = "pip-audit"
security_static = "sonarqube"

[policies]
network_optional = true
local_first = true
write_reports = true
keep_timestamped_logs = true
