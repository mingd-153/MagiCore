[package]
name = "mg-cicd-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CI/CD ecosystem adapter for MegaGate"

[dependencies]
# Core crates (W1-W5 support)
mg-types = { path = "../../core/crates/mg-types" }
mg-crypto = { workspace = true }
mg-lockfile = { workspace = true }
mg-cache = { workspace = true }
mg-config = { workspace = true }
mg-adapter-base = { workspace = true }

# Async
async-trait.workspace = true
tokio.workspace = true

# Serialization
serde = { workspace = true, features = ["derive"] }
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[lints]
workspace = true
