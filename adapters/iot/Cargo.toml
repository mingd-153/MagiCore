[package]
name = "mgc-iot-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "IoT ecosystem adapter for MagiCore (esp32-rust/platformio/zephyr)"

[dependencies]
# Core crates (W1-W6 support)
mgc-types = { workspace = true }
mgc-crypto = { workspace = true }
mgc-lockfile = { workspace = true }
mgc-sbom = { workspace = true }
mgc-cache = { workspace = true }
mgc-adapter-base = { workspace = true }
mgc-config = { workspace = true }
mgc-exec = { workspace = true }
mgc-ui = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "perf_bench"
harness = false

[[bench]]
name = "iot_bench"
harness = false
