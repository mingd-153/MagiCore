[package]
name = "mgc-web-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Web ecosystem adapter for MagiCore"

[dependencies]
# Core crates
mgc-types = { workspace = true }
mgc-adapter-base = { workspace = true }
mgc-config = { workspace = true }
mgc-crypto = { workspace = true }
mgc-cache = { workspace = true }
mgc-sbom = { workspace = true }
mgc-resolver = { workspace = true }
mgc-store = { workspace = true }
mgc-lockfile = { workspace = true }
mgc-fetcher = { workspace = true }
mgc-http = { workspace = true }
mgc-ui = { workspace = true }
mgc-exec = { workspace = true }
mgc-platform = { workspace = true }
mgc-search = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
semver = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
dashmap = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
lru = { workspace = true }
urlencoding = "2"
chrono = { workspace = true }

# Parallelism
rayon = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[lints]
workspace = true

[[bench]]
name = "large_install"
harness = false

[[bench]]
name = "install_bench"
harness = false

[[bench]]
name = "cold_path"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "stress"
harness = false
