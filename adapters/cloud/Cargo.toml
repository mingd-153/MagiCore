[package]
name = "mgc-cloud-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cloud ecosystem adapter for MagiCore (cdk/pulumi/terraform)"

[dependencies]
# Core crates (W1-W6 support)
mgc-types = { workspace = true }
mgc-crypto = { workspace = true }
mgc-lockfile = { workspace = true }
mgc-sbom = { workspace = true }
mgc-cache = { workspace = true }
mgc-config = { workspace = true }
mgc-adapter-base = { workspace = true }
mgc-exec = { workspace = true }

# Web delegate (cdk/pulumi npm-format)
mgc-web-adapter = { path = "../web" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
