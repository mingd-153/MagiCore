[package]
name = "mg-cloud-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cloud ecosystem adapter for MegaGate (cdk/pulumi/terraform)"

[dependencies]
# Core crates
mg-types = { workspace = true }
mg-exec = { workspace = true }

# Web delegate (cdk/pulumi npm-format)
mg-web-adapter = { path = "../web" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
