[package]
name = "mgc-lib-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Library ecosystem adapter for MagiCore (ts/rust/python)"

[dependencies]
# Core crates (W1-W6 support)
mgc-types = { workspace = true }
mgc-crypto = { workspace = true }
mgc-lockfile = { workspace = true }
mgc-sbom = { workspace = true }
mgc-cache = { workspace = true }
mgc-adapter-base = { workspace = true }
mgc-config = { workspace = true }
mgc-exec = { workspace = true }
mgc-web-adapter = { path = "../web" }
mgc-ui = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
semver = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[[bench]]
name = "perf_bench"
harness = false
