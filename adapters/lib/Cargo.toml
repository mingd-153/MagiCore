[package]
name = "mg-lib-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Library ecosystem adapter for MegaGate (ts/rust/python)"

[dependencies]
# Core crates (W1-W6 support)
mg-types = { workspace = true }
mg-crypto = { workspace = true }
mg-lockfile = { workspace = true }
mg-sbom = { workspace = true }
mg-cache = { workspace = true }
mg-adapter-base = { workspace = true }
mg-config = { workspace = true }
mg-exec = { workspace = true }
mg-web-adapter = { path = "../web" }
mg-ui = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
semver = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[[bench]]
name = "perf_bench"
harness = false
