name = "magicore-web"
binary = "mgc"
description = "MagiCore single-core web distribution"
mode = "single-core"
primary_core = "web"
no_default_features = true
features = ["web"]
install_hint = "brew install magicore-web  |  curl -fsSL https://raw.githubusercontent.com/mingd-153/MagiCore/main/scripts/install-from-gh.sh | bash -s -- --package magicore-web"
