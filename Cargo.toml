[workspace]
resolver = "2"
members = [
    "crates/megagate-types",
    "crates/megagate-resolver",
    "crates/megagate-linker",
    "crates/megagate-extractor",
    "crates/megagate-fetcher",
    "crates/megagate-security",
    "crates/megagate-core",
    "crates/megagate-cli",
    "crates/megagate-ffi",
]
exclude = [
    "webapp-core/napi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/megagate/megagate"
authors = ["MegaGate Team <team@megagate.dev>"]

[workspace.dependencies]
# Core
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.0", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros"] }
async-trait = "0.1"
semver = { version = "1.0", features = ["serde"] }
hex = "0.4"
base64 = "0.22"

# Schema/Proto
prost = "0.12"
prost-types = "0.12"
prost-build = "0.12"
tonic = { version = "0.11", features = ["tls", "transport"] }
tonic-build = "0.11"
bytes = "1.0"

# FFI
uniffi = { version = "0.28" }
uniffi_build = "0.28"
napi = { version = "3.9", features = ["napi7", "napi8", "tokio_rt"] }
napi-derive = "3.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# HTTP/Crypto
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "stream", "rustls-tls"] }
sha2 = "0.10"
ring = "0.17"
uuid = { version = "1.0", features = ["v4"] }
schemars = "0.8"

# Config
toml = "0.8"
dirs = "5.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"
ratatui = "0.27"
crossterm = "0.28"

# Testing
proptest = "1.0"
mockall = "0.13"
criterion = "0.5"

# Utilities
once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
humantime = "2.1"
walkdir = "2.4"
strsim = "0.11"
unicode-normalization = "0.1"
regex = "1.10"
governor = "0.6"
flume = "0.11"
sysinfo = "0.30"
if-addrs = "0.6"
which = "5.0"

[workspace.lints.rust]
all = "warn"
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3