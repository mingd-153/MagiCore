[workspace]
resolver = "2"
members = [
    "core/crates/mg-types",
    "core/crates/mg-crypto",
    "core/crates/mg-store",
    "core/crates/mg-resolver",
    "core/crates/mg-lockfile",
    "core/crates/mg-fetcher",
    "core/crates/mg-http",
    "core/crates/mg-config",
    "core/crates/mg-ui",
    "core/crates/mg-adapter-base",
    "adapters/web",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mingd-153/MegaGate"
authors = ["MegaGate Contributors <doanmihh1543@gmail.com>"]
description = "MegaGate - Universal Package Manager: Web, AI, Game, Cloud, IoT"

[workspace.dependencies]
# Internal crates
mg-types    = { path = "core/crates/mg-types" }
mg-crypto   = { path = "core/crates/mg-crypto" }
mg-store    = { path = "core/crates/mg-store" }
mg-resolver = { path = "core/crates/mg-resolver" }
mg-lockfile = { path = "core/crates/mg-lockfile" }
mg-fetcher  = { path = "core/crates/mg-fetcher" }
mg-http     = { path = "core/crates/mg-http" }
mg-config   = { path = "core/crates/mg-config" }
mg-ui       = { path = "core/crates/mg-ui" }
mg-adapter-base = { path = "core/crates/mg-adapter-base" }

# Async runtime
tokio       = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"] }
url     = "2.5"
governor = { version = "0.6", features = ["std"] }

# Serialization
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml       = "0.8"
toml_edit  = "0.22"
bincode    = "1.3"

# Archive / Compression
tar    = "0.4"
flate2 = "1.0"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }

# Hashing & Crypto
sha2   = "0.10"
blake3 = "1.5"
hex    = "0.4"
base64 = "0.22"
digest = "0.10"

# File system
walkdir  = "2.5"
tempfile = "3.8"
dirs     = "5.0"
fs2      = "0.4"

# CLI
clap         = { version = "4.5", features = ["derive", "env", "color"] }
clap_complete = "4.5"
indicatif    = { version = "0.17", features = ["rayon"] }
console      = "0.15"
colored      = "2.1"

# TUI
ratatui   = "0.28"
crossterm = "0.28"

# Interactive prompts
dialoguer = "0.11"

# Templating
handlebars = "6.0"
heck       = "0.5"

# Error handling
thiserror = "1.0"
anyhow    = "1.0"

# Concurrency
dashmap = "5.5"
rayon   = "1.10"
parking_lot = "0.12"
flume   = "0.11"

# Database
rusqlite = { version = "0.31", features = ["bundled", "column_decltype"] }

# Semver
semver = { version = "1.0", features = ["serde"] }

# Utilities
uuid    = { version = "1.0", features = ["v4", "serde"] }
lru     = "0.12"
once_cell = "1.19"
sysinfo = "0.31"
libc    = "0.2"
mimalloc = { version = "0.1", features = ["secure"] }

# Tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Schema
schemars = { version = "0.8", features = ["derive"] }

# Build
cc = "1.0"

# Testing
proptest         = "1.4"
rstest           = "0.18"
pretty_assertions = "1.4"
tempfile_macro   = "0.1"

[workspace.lints.rust]
unused_imports   = "warn"
unused_variables = "warn"
dead_code        = "warn"

[workspace.lints.clippy]
all        = { level = "warn", priority = -1 }
pedantic   = { level = "warn", priority = -1 }
module_name_repetitions  = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
too_many_lines           = "allow"
too_many_arguments       = "allow"
must_use_candidate       = "allow"

[profile.release]
opt-level       = 3
lto             = "fat"
codegen-units   = 1
panic           = "abort"
strip           = true

[profile.dev]
opt-level = 0
debug     = 2

[profile.test]
opt-level = 2
debug     = 2
