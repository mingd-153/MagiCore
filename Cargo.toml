[workspace]
members = [
    "core/crates/*",
    "adapters/*",
    "cli",
    "tools/*",
]
exclude = ["tools/core-web-lab"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mingd-153/MegaGate"
authors = ["MegaGate Contributors"]

[workspace.dependencies]
# Internal crates
mg-types = { path = "core/crates/mg-types" }
mg-config = { path = "core/crates/mg-config" }
mg-crypto = { path = "core/crates/mg-crypto" }
mg-http = { path = "core/crates/mg-http" }
mg-fetcher = { path = "core/crates/mg-fetcher" }
mg-lockfile = { path = "core/crates/mg-lockfile" }
mg-resolver = { path = "core/crates/mg-resolver" }
mg-store = { path = "core/crates/mg-store" }
mg-ui = { path = "core/crates/mg-ui" }
mg-adapter-base = { path = "core/crates/mg-adapter-base" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "rustls-tls", "http2"] }
url = "2.5"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-full"] }
notify = "6.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
indicatif = "0.17"
console = "0.15"
colored = "2.1"
dialoguer = "0.11"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Crypto
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
base64 = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
futures-util = "0.3"
regex = "1.11"

# Bundler (native Rust)
esbuild-rs = "0.13"
glob = "0.3"
mime_guess = "2.0"
lightningcss = { version = "1.0.0-alpha.71", features = ["serde"] }

# Concurrency
dashmap = "6.1"
rayon = "1.10"
parking_lot = "0.12"

# Testing
proptest = "1.5"
rstest = "0.18"
pretty_assertions = "1.4"
tempfile = "3.12"
criterion = { version = "0.5", features = ["async_tokio"] }

# Storage / files
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
dirs = "5.0"
fs2 = "0.4"
lru = "0.12"

# Compression
tar = "0.4"
flate2 = { version = "1.0", features = ["zlib"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

# Utilities
semver = "1.0"
time = { version = "0.3", features = ["parsing", "formatting"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
