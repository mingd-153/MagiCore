[workspace]
members = [
    "core/crates/*",
    "adapters/*",
    "cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mingd-153/MegaGate"
authors = ["MegaGate Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
console = "0.15"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Crypto
sha2 = "0.10"
hex = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Concurrency
dashmap = "6.1"
rayon = "1.10"

# Testing
proptest = "1.5"
rstest = "0.18"
