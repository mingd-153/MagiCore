[package]
default-run = "megagate"
name = "megagate"
version = "0.1.0"
edition = "2021"

[dependencies]

once_cell = "1.19"
agent_memory = { path = "./agent_memory" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "stream"] }
sha2 = "0.10"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

# async runtime for parallel ops
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
chrono = "0.4"
colored = "2.1"
indicatif = "0.17"
ratatui = "0.27"

[[bin]]
name = "mg"
path = "src/main.rs"

crossterm = "0.28"
