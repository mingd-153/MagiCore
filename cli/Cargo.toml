[package]
name = "mg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MegaGate - Universal Package Manager CLI"

[[bin]]
name = "mga"
path = "src/main.rs"

[dependencies]
# Core crates
mg-types = { workspace = true }
mg-adapter-base = { workspace = true }
mg-config = { workspace = true }
mg-resolver = { workspace = true }
mg-store = { workspace = true }
mg-lockfile = { workspace = true }
mg-crypto = { workspace = true }
mg-cache = { workspace = true }
mg-fetcher = { workspace = true }
mg-http = { workspace = true }
mg-ui = { workspace = true }
mg-pack = { workspace = true }
mg-publish = { workspace = true }
mg-registry-server = { workspace = true }
mg-oci = { workspace = true }
mg-exec = { workspace = true }
mg-plugin = { workspace = true }
mg-workspace = { workspace = true }

# Adapters (optional — per-core feature flags)
mg-web-adapter = { path = "../adapters/web", optional = true }
mg-lib-adapter = { path = "../adapters/lib", optional = true }
mg-game-adapter = { path = "../adapters/game", optional = true }
mg-iot-adapter = { path = "../adapters/iot", optional = true }
mg-cloud-adapter = { path = "../adapters/cloud", optional = true }
mg-app-adapter = { path = "../adapters/app", optional = true }
mg-cicd-adapter = { path = "../adapters/cicd", optional = true }
mg-ai-adapter = { path = "../adapters/ai", optional = true }
mg-hardware-adapter = { path = "../adapters/hardware", optional = true }

# CLI
clap = { workspace = true }
clap_complete = { workspace = true }
semver = { workspace = true }

# Async
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Compression
axum = { workspace = true }
tower-http = { workspace = true }
notify = { workspace = true }

# Bundler
esbuild-rs = { workspace = true }
glob = { workspace = true }
mime_guess = { workspace = true }
lightningcss = { version = "1.0.0-alpha.71", features = ["serde"] }
futures-util = { workspace = true }
walkdir = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }

# Import rewriting + hashing
regex = { workspace = true }
blake3 = { workspace = true }

# Utilities
colored = { workspace = true }
dirs = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
crossterm = { workspace = true }
tempfile = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Feature flags per core — used for per-core binary builds
[features]
default = ["all"]
all      = ["web", "game", "ai", "clo", "cicd", "iot", "app", "lib", "hardware"]
web      = ["mg-web-adapter"]
game     = ["mg-game-adapter"]
ai       = ["mg-ai-adapter"]
clo      = ["mg-cloud-adapter"]
cicd     = ["mg-cicd-adapter"]
iot      = ["mg-iot-adapter"]
app      = ["mg-app-adapter"]
lib      = ["mg-lib-adapter"]
hardware = ["mg-hardware-adapter"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
reqwest = { workspace = true }

[[test]]
name = "trust_integration"
path = "test/trust/mod.rs"

[lints]
workspace = true
