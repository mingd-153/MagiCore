[package]
name = "mg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MegaGate - Universal Package Manager CLI"

[[bin]]
name = "mg"
path = "src/main.rs"

[dependencies]
# Core crates
mg-types = { workspace = true }
mg-adapter-base = { workspace = true }
mg-config = { workspace = true }
mg-resolver = { workspace = true }
mg-store = { workspace = true }
mg-lockfile = { workspace = true }
mg-fetcher = { workspace = true }
mg-http = { workspace = true }
mg-ui = { workspace = true }

# Adapters (optional — per-core feature flags)
mg-web-adapter = { path = "../adapters/web", optional = true }

# CLI
clap = { workspace = true }
clap_complete = { workspace = true }

# Async
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# HTTP
reqwest = { workspace = true }
url = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
notify = { workspace = true }

# Bundler
esbuild-rs = { workspace = true }
glob = { workspace = true }
mime_guess = { workspace = true }
lightningcss = { version = "1.0.0-alpha.71", features = ["serde"] }
futures-util = { workspace = true }
walkdir = { workspace = true }
time = { workspace = true }

# Import rewriting + hashing
regex = { workspace = true }
blake3 = { workspace = true }

# Utilities
colored = { workspace = true }
dirs = { workspace = true }
crossterm = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Feature flags per core — used for per-core binary builds
[features]
default = ["all"]
all      = ["web", "game", "ai", "clo", "cicd", "iot", "app", "lib"]
web      = ["mg-web-adapter"]
game     = []
ai       = []
clo      = []
cicd     = []
iot      = []
app      = []
lib      = []

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
