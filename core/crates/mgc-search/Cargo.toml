[package]
name = "mgc-search"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Multi-registry search engine for MagiCore - search packages across npm, crates.io, pkg.go.dev, PyPI"
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Cache storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Utilities
chrono = "0.4"
dirs = "5"
urlencoding = "2.1"

# MagiCore crates
mgc-types = { path = "../mgc-types" }
mgc-platform = { path = "../mgc-platform" }

[dev-dependencies]
mockito.workspace = true
tempfile = "3"

[[test]]
name = "types"
path = "tests/types.rs"

[[test]]
name = "client"
path = "tests/client.rs"

[[test]]
name = "orchestrator"
path = "tests/orchestrator.rs"

[[test]]
name = "ranking"
path = "tests/ranking.rs"

[[test]]
name = "cache"
path = "tests/cache.rs"
