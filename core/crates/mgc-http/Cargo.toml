[package]
name = "mgc-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP helpers for MagiCore"

[dependencies]
reqwest = { workspace = true }
url = { workspace = true }
http = { workspace = true }
mime = "0.3"
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
regex = { workspace = true }
rustls = { version = "0.23", features = ["std", "tls12"] }
rustls-pki-types = { version = "1.9", features = ["std"] }  # Replaced rustls-pemfile (unmaintained RUSTSEC-2025-0134)
webpki-roots = "0.25"
serde_json = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
rustls-native-certs = "0.8"  # Updated to 0.8.x which dropped rustls-pemfile dependency

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = "0.4"

[[test]]
name = "test_security"
path = "tests/security.rs"

[lints]
workspace = true
