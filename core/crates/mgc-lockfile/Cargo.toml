[package]
name = "mgc-lockfile"
version = "1.0.0"
edition = "2021"
authors = ["MagiCore Contributors"]
description = "Cryptographically signed lockfile for Zero-Trust Supply Chain"
license = "MIT"

[lib]
path = "src/lib.rs"

# Test modules tách riêng (RULE §5)
[[test]]
name = "schema"
path = "tests/schema.rs"

[[test]]
name = "tamper"
path = "tests/tamper.rs"

[[test]]
name = "migrate"
path = "tests/migrate.rs"

[[test]]
name = "import"
path = "tests/import.rs"

[dependencies]
# Crypto primitives (local crate)
mgc-crypto = { path = "../mgc-crypto", version = "1.0.0" }

# TOML parsing/serialization
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml.workspace = true

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Chrono for timestamps
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
