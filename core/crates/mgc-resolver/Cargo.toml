[package]
name = "mgc-resolver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Dependency resolver for MagiCore"

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
mgc-types = { workspace = true }
mgc-platform = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
# Phase 2 native registry engines — HTTP + JSON/NDJSON + BLAKE3 CAS + tar.gz.
# (Engine registry native Phase 2 — HTTP + JSON/NDJSON + BLAKE3 CAS + tar.gz.)
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
blake3 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
# Go engine: base64 for the sumdb h1 dirhash (already-pinned workspace deps —
# no new external crates). (Engine Go: base64 cho dirhash h1 của sumdb —
# workspace dep đã ghim sẵn, không thêm crate ngoài.)
base64 = { workspace = true }
# Maven engine: sha1 for .jar.sha1 verification (pinned workspace dep).
# (Engine Maven: sha1 để xác minh .jar.sha1 — workspace dep đã ghim.)
sha1 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
mockito.workspace = true
mgc-store = { workspace = true }

# Test riêng — test/ folder (RULE §5: cấm #[cfg(test)] trong src/)
[[test]]
name = "test_patches"
path = "tests/patches.rs"

[[test]]
name = "test_dedupe"
path = "tests/dedupe.rs"

[[test]]
name = "protocols"
path = "tests/protocols.rs"

[[test]]
name = "test_protocols_go"
path = "tests/protocols_go.rs"

[[test]]
name = "test_protocols_maven"
path = "tests/protocols_maven.rs"

[[test]]
name = "test_protocols_nuget"
path = "tests/protocols_nuget.rs"

[[test]]
name = "test_protocols_zip"
path = "tests/protocols_zip.rs"
