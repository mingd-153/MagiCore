[package]
name = "mg-lockfile"
version = "1.0.0"
edition = "2021"
authors = ["MegaGate Contributors"]
description = "Cryptographically signed lockfile for Zero-Trust Supply Chain"
license = "MIT"

[lib]
path = "src/lib.rs"

# Test modules tách riêng (RULE §5)
[[test]]
name = "schema"
path = "test/schema.rs"

[[test]]
name = "tamper"
path = "test/tamper.rs"

[[test]]
name = "migrate"
path = "test/migrate.rs"

[dependencies]
# Crypto primitives (local crate)
mg-crypto = { path = "../mg-crypto", version = "1.0.0" }

# TOML parsing/serialization
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Chrono for timestamps
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
