[package]
name = "mgc-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Exec passthrough + allowlist + audit sanitizer (MagiCore)"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# libc: group-signals for the timeout process-tree kill (kill(-pgid)) —
# already a workspace dependency elsewhere; no new external crate added.
# Unix-only so the Windows build links nothing new.
# (libc: group-signal cho kill process-tree theo timeout (kill(-pgid)) —
# đã là workspace dependency ở chỗ khác; không thêm crate ngoài mới.
# Chỉ unix để build Windows không link thêm gì.)
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "test_allowlist"
path = "tests/allowlist.rs"

[[test]]
name = "test_sanitizer"
path = "tests/sanitizer.rs"

[[test]]
name = "test_run"
path = "tests/run.rs"

[lints]
workspace = true
