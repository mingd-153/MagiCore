name: Fuzz
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - lockfile_parse
          - registry_response

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600 -timeout=30
        working-directory: web/mgpm/fuzz
        continue-on-error: true

      - name: Minimize corpus
        run: cargo fuzz build ${{ matrix.target }}
        working-directory: web/mgpm/fuzz
