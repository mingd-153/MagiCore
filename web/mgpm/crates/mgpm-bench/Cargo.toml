[package]
name = "mgpm-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["mimalloc"]
system-alloc = []

[dependencies]
mgpm-core = { path = "../mgpm-core" }
mgpm-store = { path = "../mgpm-store" }
mimalloc = { workspace = true, optional = true }
mgpm-resolver = { path = "../mgpm-resolver" }
mgpm-lockfile = { path = "../mgpm-lockfile" }
mgpm-installer = { path = "../mgpm-installer" }
mgpm-linker = { path = "../mgpm-linker" }
mgpm-registry = { path = "../mgpm-registry" }
mgpm-workspace = { path = "../mgpm-workspace" }
criterion.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tempfile = "3.8"
walkdir.workspace = true
indicatif.workspace = true
console.workspace = true
tracing.workspace = true

[[bench]]
name = "store"
path = "benches/store.rs"
harness = false

[[bench]]
name = "resolver"
path = "benches/resolver.rs"
harness = false

[[bench]]
name = "lockfile"
path = "benches/lockfile.rs"
harness = false