[package]
name = "mgpm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mgpm-core = { path = "../mgpm-core" }
mgpm-store = { path = "../mgpm-store" }
mgpm-resolver = { path = "../mgpm-resolver" }
mgpm-lockfile = { path = "../mgpm-lockfile" }
mgpm-installer = { path = "../mgpm-installer" }
mgpm-linker = { path = "../mgpm-linker" }
mgpm-registry = { path = "../mgpm-registry" }
mgpm-workspace = { path = "../mgpm-workspace" }
mgpm-plugins = { path = "../mgpm-plugins" }
mimalloc = { workspace = true, optional = true }
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
napi.workspace = true
napi-derive.workspace = true
clap.workspace = true
clap_complete.workspace = true
url.workspace = true
colored.workspace = true
indicatif.workspace = true
console.workspace = true
tracing.workspace = true
once_cell.workspace = true
dirs.workspace = true
serde_yaml.workspace = true
semver.workspace = true
hex.workspace = true
base64.workspace = true
flate2.workspace = true
rusqlite.workspace = true
toml.workspace = true
reqwest.workspace = true

[features]
default = ["mimalloc"]
system-alloc = []

[dev-dependencies]
proptest.workspace = true
pretty_assertions.workspace = true
rstest.workspace = true
tempfile = "3.8"